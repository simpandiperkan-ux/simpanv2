<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>QR STIKER SIMPAN V1 ULTRA FINAL</title>

<!-- ===================================================== -->
<!-- FONT -->
<!-- ===================================================== -->

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<!-- ===================================================== -->
<!-- QR CODE -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- ===================================================== -->
<!-- PAPAPARSE -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- ===================================================== -->
<!-- HTML2CANVAS -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* ===================================================== */
/* RESET */
/* ===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ===================================================== */
/* BODY */
/* ===================================================== */

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#dfe7f5,
#cfd9ea
);

min-height:100vh;

padding:40px;

display:flex;

flex-direction:column;

align-items:center;

overflow-x:auto;

}

/* ===================================================== */
/* SEARCH */
/* ===================================================== */

.search-box{

display:flex;

gap:22px;

width:100%;

max-width:1200px;

margin-bottom:30px;

}

.search-box input{

flex:1;

height:92px;

border:none;

outline:none;

padding:0 38px;

font-size:26px;

font-weight:700;

border-radius:28px;

background:white;

box-shadow:
0 15px 40px rgba(0,0,0,.10);

}

.search-box button{

width:320px;

border:none;

border-radius:28px;

background:
linear-gradient(
135deg,
#0066ff,
#00a6ff
);

color:white;

font-size:28px;

font-weight:900;

cursor:pointer;

transition:.3s;

box-shadow:
0 16px 40px rgba(0,0,0,.18);

}

.search-box button:hover{

transform:
translateY(-2px)
scale(1.02);

}

/* ===================================================== */
/* ACTIONS */
/* ===================================================== */

.actions{

display:flex;

gap:18px;

margin-bottom:34px;

flex-wrap:wrap;

justify-content:center;

}

.actions button{

padding:18px 32px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

color:white;

font-size:17px;

font-weight:800;

cursor:pointer;

transition:.3s;

box-shadow:
0 8px 22px rgba(0,0,0,.18);

}

.actions button:hover{

transform:
translateY(-2px);

}

/* ===================================================== */
/* CARD */
/* ===================================================== */

.card{

width:1450px;

background:white;

border-radius:40px;

padding:60px;

position:relative;

overflow:hidden;

border:
8px solid #005eff;

box-shadow:
0 28px 80px rgba(0,0,0,.18);

}

/* ===================================================== */
/* WATERMARK */
/* ===================================================== */

.card::before{

content:"";

position:absolute;

inset:0;

background-image:url('../logo-simpan.png');

background-repeat:repeat;

background-size:200px;

opacity:.03;

pointer-events:none;

}

/* ===================================================== */
/* HEADER */
/* ===================================================== */

.header{

display:flex;

justify-content:space-between;

align-items:flex-start;

padding-bottom:40px;

border-bottom:
2px solid rgba(0,94,255,.18);

margin-bottom:46px;

position:relative;
z-index:2;

}

/* ===================================================== */
/* HEADER LEFT */
/* ===================================================== */

.header-left{

display:flex;

align-items:flex-start;

gap:34px;

}

/* ===================================================== */
/* LOGO BATENG */
/* ===================================================== */

.logo-bateng{

width:170px;

margin-top:24px;

object-fit:contain;

}

/* ===================================================== */
/* HEADER TEXT */
/* ===================================================== */

.header-text h1{

font-size:82px;

font-weight:900;

line-height:1.05;

color:#0047b3;

margin-bottom:18px;

}

.header-text p{

font-size:28px;

font-weight:500;

line-height:1.5;

color:#333;

}

/* ===================================================== */
/* LOGO SIMPAN */
/* ===================================================== */

.logo-simpan{

width:300px;

margin-top:28px;

object-fit:contain;

}

/* ===================================================== */
/* QR SECTION */
/* ===================================================== */

.qr-section{

display:grid;

grid-template-columns:
620px 1fr;

gap:48px;

align-items:stretch;

position:relative;
z-index:2;

}

/* ===================================================== */
/* QR BOX */
/* ===================================================== */

.qr-box{

border:
6px solid #005eff;

border-radius:30px;

padding:36px;

display:flex;

justify-content:center;

align-items:center;

background:white;

height:620px;

}

/* ===================================================== */
/* INFO */
/* ===================================================== */

.info{

display:flex;

flex-direction:column;

gap:32px;

height:620px;

}

/* ===================================================== */
/* ID BOX */
/* ===================================================== */

.id-box{

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

border-radius:28px;

height:150px;

display:flex;

justify-content:center;

align-items:center;

box-shadow:
0 14px 34px rgba(0,0,0,.16);

padding:0 36px;

}

.id-box h2{

font-size:82px;

font-weight:900;

color:white;

white-space:nowrap;

line-height:1;

}

/* ===================================================== */
/* DETAIL BOX */
/* ===================================================== */

.detail-box{

flex:1;

background:
rgba(0,94,255,.04);

border:
2px solid rgba(0,94,255,.15);

border-radius:26px;

padding:42px;

display:flex;

flex-direction:column;

justify-content:center;

}

/* ===================================================== */
/* DETAIL ITEM */
/* ===================================================== */

.detail-item{

padding:24px 0;

border-bottom:
2px solid rgba(0,94,255,.14);

}

.detail-item:last-child{

border-bottom:none;

}

.detail-item h3{

font-size:22px;

font-weight:500;

color:#444;

margin-bottom:12px;

}

.detail-item p{

font-size:38px;

font-weight:800;

color:#0047b3;

line-height:1.3;

}

/* ===================================================== */
/* FOOTER */
/* ===================================================== */

.footer{

margin-top:44px;

padding-top:34px;

border-top:
2px solid rgba(0,94,255,.18);

text-align:center;

position:relative;
z-index:2;

}

.footer h3{

font-size:38px;

font-weight:900;

color:#005eff;

margin-bottom:12px;

}

.footer p{

font-size:22px;

font-weight:600;

color:#333;

}

/* ===================================================== */
/* RESPONSIVE */
/* ===================================================== */

@media(max-width:1500px){

.card{

width:100%;

padding:34px;

}

.header{

flex-direction:column;

gap:28px;

}

.qr-section{

grid-template-columns:1fr;

}

.logo-simpan{

width:220px;

}

.header-text h1{

font-size:54px;

}

.id-box h2{

font-size:54px;

}

.qr-box,
.info{

height:auto;

}

}

/* ===================================================== */
/* PRINT */
/* ===================================================== */

@media print{

body{

background:white;
padding:0;

}

.search-box,
.actions{

display:none;

}

.card{

box-shadow:none;
margin:0 auto;

}

}

</style>

</head>

<body>

<!-- ===================================================== -->
<!-- SEARCH -->
<!-- ===================================================== -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan 4 digit ID belakang..."
>

<button onclick="cariQR()">

🔍 CARI QR

</button>

</div>

<!-- ===================================================== -->
<!-- ACTIONS -->
<!-- ===================================================== -->

<div class="actions">

<button onclick="downloadPNG()">
🖼 Download PNG
</button>

<button onclick="downloadJPG()">
🖼 Download JPG
</button>

<button onclick="window.print()">
📄 Download PDF
</button>

</div>

<!-- ===================================================== -->
<!-- CARD -->
<!-- ===================================================== -->

<div class="card" id="card">

<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->

<div class="header">

<div class="header-left">

<img
src="../logo-bateng.png"
class="logo-bateng"
>

<div class="header-text">

<h1>

DINAS PERIKANAN
<br>
KABUPATEN
<br>
BANGKA TENGAH

</h1>

<p>

Sistem Informasi Manajemen Pendataan
<br>
Armada Nelayan

</p>

</div>

</div>

<img
src="../logo-simpan.png"
class="logo-simpan"
>

</div>

<!-- ===================================================== -->
<!-- QR SECTION -->
<!-- ===================================================== -->

<div class="qr-section">

<!-- QR -->

<div class="qr-box">

<div id="qrcode"></div>

</div>

<!-- INFO -->

<div class="info">

<!-- ID -->

<div class="id-box">

<h2 id="idText">
BT-SMP-0001
</h2>

</div>

<!-- DETAIL -->

<div class="detail-box">

<div class="detail-item">

<h3>
👤 Pemilik :
</h3>

<p id="namaPemilik">
-
</p>

</div>

<div class="detail-item">

<h3>
🚢 Nama Kapal :
</h3>

<p id="namaKapal">
-
</p>

</div>

<div class="detail-item">

<h3>
📅 Tanggal Cetak :
</h3>

<p id="tanggal">
-
</p>

</div>

</div>

</div>

</div>

<!-- ===================================================== -->
<!-- FOOTER -->
<!-- ===================================================== -->

<div class="footer">

<h3>
SCAN QR UNTUK VERIFIKASI DATA KAPAL
</h3>

<p>

SIMPAN V1 • DINAS PERIKANAN KABUPATEN BANGKA TENGAH

</p>

</div>

</div>

<script>

/* ===================================================== */
/* CSV */
/* ===================================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSBI5O8DJD_-VoI2Bf3NDHY_x1eFO8vQgrmpw7L1VW_HczX9avlE5HVX2yN16nRQ8gq_UD0xp_wWfvk/pub?output=csv&t=" +
new Date().getTime();

/* ===================================================== */
/* URL PARAM */
/* ===================================================== */

const params =
new URLSearchParams(
window.location.search
);

let id =
params.get("id") ||
"BT-SMP-0001";

/* ===================================================== */
/* DATE */
/* ===================================================== */

document.getElementById(
"tanggal"
).innerHTML =

new Date().toLocaleDateString(
"id-ID"
);

/* ===================================================== */
/* LOAD CSV */
/* ===================================================== */

Papa.parse(csvUrl,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

const data = result.data;

/* ===================================================== */
/* FIND DATA */
/* ===================================================== */

const kapal = data.find(item =>

(item["ID SIMPAN"] || "")
.toString()
.trim()
.toUpperCase()

===

id.toUpperCase()

);

/* ===================================================== */
/* SET DATA */
/* ===================================================== */

if(kapal){

document.getElementById(
"idText"
).innerHTML =

kapal["ID SIMPAN"] || "-";

document.getElementById(
"namaPemilik"
).innerHTML =

kapal["Nama Pemilik Kapal (Sesuai KTP)"] || "-";

document.getElementById(
"namaKapal"
).innerHTML =

kapal["Nama Kapal"] || "-";

}

/* ===================================================== */
/* QR CODE */
/* ===================================================== */

QRCode.toCanvas(

document.createElement("canvas"),

window.location.origin +
"/simpanv2/v1/kapal.html?id=" +
id,

{
width:470
},

function(err,canvas){

if(err){

console.log(err);

return;

}

document
.getElementById("qrcode")
.innerHTML = "";

document
.getElementById("qrcode")
.appendChild(canvas);

}

);

}

});

/* ===================================================== */
/* SEARCH */
/* ===================================================== */

function cariQR(){

const input =
document.getElementById(
"searchInput"
)
.value
.trim();

if(!input){

alert(
"Masukkan 4 digit ID belakang"
);

return;

}

window.location.href =
"?id=BT-SMP-" + input;

}

/* ===================================================== */
/* ENTER */
/* ===================================================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

cariQR();

}

}
);

/* ===================================================== */
/* DOWNLOAD PNG */
/* ===================================================== */

function downloadPNG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".png";

link.href =
canvas.toDataURL();

link.click();

});

}

/* ===================================================== */
/* DOWNLOAD JPG */
/* ===================================================== */

function downloadJPG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".jpg";

link.href =
canvas.toDataURL(
"image/jpeg"
);

link.click();

});

}

</script>

</body>
</html>
