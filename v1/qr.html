<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN V1 FINAL</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* ====================================================== */
/* RESET */
/* ====================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ====================================================== */
/* BODY */
/* ====================================================== */

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#dfe7f5,
#cfd9ea
);

min-height:100vh;

padding:40px;

display:flex;

flex-direction:column;

align-items:center;

overflow-x:auto;

}

/* ====================================================== */
/* SEARCH */
/* ====================================================== */

.search-box{

display:flex;

gap:18px;

width:100%;

max-width:1100px;

margin-bottom:26px;

}

.search-box input{

flex:1;

height:82px;

border:none;

outline:none;

padding:0 34px;

font-size:24px;

font-weight:700;

border-radius:24px;

background:white;

box-shadow:
0 10px 30px rgba(0,0,0,.10);

}

.search-box button{

width:280px;

border:none;

border-radius:24px;

background:
linear-gradient(
135deg,
#0066ff,
#00a6ff
);

color:white;

font-size:26px;

font-weight:900;

cursor:pointer;

transition:.3s;

box-shadow:
0 12px 30px rgba(0,0,0,.16);

}

.search-box button:hover{

transform:
translateY(-2px);

}

/* ====================================================== */
/* BUTTONS */
/* ====================================================== */

.actions{

display:flex;

gap:14px;

margin-bottom:30px;

flex-wrap:wrap;

justify-content:center;

}

.actions button{

padding:15px 28px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

color:white;

font-size:15px;

font-weight:800;

cursor:pointer;

transition:.3s;

box-shadow:
0 8px 20px rgba(0,0,0,.16);

}

.actions button:hover{

transform:
translateY(-2px);

}

/* ====================================================== */
/* CARD */
/* ====================================================== */

.card{

width:1320px;

background:white;

border-radius:36px;

padding:44px;

position:relative;

overflow:hidden;

border:
6px solid #005eff;

box-shadow:
0 24px 60px rgba(0,0,0,.16);

}

/* ====================================================== */
/* WATERMARK */
/* ====================================================== */

.card::before{

content:"";

position:absolute;

inset:0;

background-image:url('../logo-simpan.png');

background-repeat:repeat;

background-size:180px;

opacity:.03;

pointer-events:none;

}

/* ====================================================== */
/* HEADER */
/* ====================================================== */

.header{

display:flex;

justify-content:space-between;

align-items:flex-start;

padding-bottom:34px;

border-bottom:
2px solid rgba(0,94,255,.18);

margin-bottom:34px;

position:relative;
z-index:2;

}

/* ====================================================== */
/* HEADER LEFT */
/* ====================================================== */

.header-left{

display:flex;

align-items:flex-start;

gap:28px;

}

/* ====================================================== */
/* LOGO BATENG */
/* ====================================================== */

.logo-bateng{

width:145px;

margin-top:18px;

object-fit:contain;

}

/* ====================================================== */
/* TEXT */
/* ====================================================== */

.header-text h1{

font-size:68px;

font-weight:900;

line-height:1.05;

color:#0047b3;

margin-bottom:16px;

}

.header-text p{

font-size:24px;

font-weight:500;

line-height:1.5;

color:#333;

}

/* ====================================================== */
/* LOGO SIMPAN */
/* ====================================================== */

.logo-simpan{

width:220px;

margin-top:20px;

object-fit:contain;

}

/* ====================================================== */
/* QR SECTION */
/* ====================================================== */

.qr-section{

display:grid;

grid-template-columns:
520px 1fr;

gap:34px;

align-items:stretch;

position:relative;
z-index:2;

}

/* ====================================================== */
/* QR BOX */
/* ====================================================== */

.qr-box{

border:
5px solid #005eff;

border-radius:24px;

padding:20px;

display:flex;

justify-content:center;

align-items:center;

background:white;

height:560px;

}

/* ====================================================== */
/* INFO */
/* ====================================================== */

.info{

display:flex;

flex-direction:column;

gap:20px;

height:560px;

}

/* ====================================================== */
/* ID BOX */
/* ====================================================== */

.id-box{

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

border-radius:22px;

height:110px;

display:flex;

justify-content:center;

align-items:center;

padding:0 28px;

box-shadow:
0 10px 26px rgba(0,0,0,.16);

}

.id-box h2{

font-size:66px;

font-weight:900;

color:white;

white-space:nowrap;

line-height:1;

}

/* ====================================================== */
/* DETAIL BOX */
/* ====================================================== */

.detail-box{

flex:1;

background:
rgba(0,94,255,.04);

border:
2px solid rgba(0,94,255,.14);

border-radius:24px;

padding:28px;

display:flex;

flex-direction:column;

justify-content:center;

}

/* ====================================================== */
/* DETAIL ITEM */
/* ====================================================== */

.detail-item{

padding:18px 0;

border-bottom:
2px solid rgba(0,94,255,.12);

}

.detail-item:last-child{

border-bottom:none;

}

.detail-item h3{

font-size:20px;

font-weight:500;

color:#444;

margin-bottom:8px;

}

.detail-item p{

font-size:34px;

font-weight:800;

color:#0047b3;

line-height:1.3;

}

/* ====================================================== */
/* FOOTER */
/* ====================================================== */

.footer{

margin-top:34px;

padding-top:26px;

border-top:
2px solid rgba(0,94,255,.18);

text-align:center;

position:relative;
z-index:2;

}

.footer h3{

font-size:34px;

font-weight:900;

color:#005eff;

margin-bottom:10px;

}

.footer p{

font-size:20px;

font-weight:600;

color:#333;

}

/* ====================================================== */
/* RESPONSIVE */
/* ====================================================== */

@media(max-width:1400px){

.card{

width:100%;

padding:28px;

}

.header{

flex-direction:column;

gap:20px;

}

.qr-section{

grid-template-columns:1fr;

}

.qr-box,
.info{

height:auto;

}

.header-text h1{

font-size:48px;

}

.id-box h2{

font-size:48px;

}

.logo-simpan{

width:170px;

}

}

/* ====================================================== */
/* PRINT */
/* ====================================================== */

@media print{

body{

background:white;
padding:0;

}

.search-box,
.actions{

display:none;

}

.card{

box-shadow:none;

}

}

</style>

</head>

<body>

<!-- ====================================================== -->
<!-- SEARCH -->
<!-- ====================================================== -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan 4 digit ID belakang..."
>

<button onclick="cariQR()">

🔍 CARI QR

</button>

</div>

<!-- ====================================================== -->
<!-- ACTIONS -->
<!-- ====================================================== -->

<div class="actions">

<button onclick="downloadPNG()">
🖼 Download PNG
</button>

<button onclick="downloadJPG()">
🖼 Download JPG
</button>

<button onclick="window.print()">
📄 Download PDF
</button>

</div>

<!-- ====================================================== -->
<!-- CARD -->
<!-- ====================================================== -->

<div class="card" id="card">

<!-- HEADER -->

<div class="header">

<div class="header-left">

<img
src="../logo-bateng.png"
class="logo-bateng"
>

<div class="header-text">

<h1>

DINAS PERIKANAN
<br>
KABUPATEN
<br>
BANGKA TENGAH

</h1>

<p>

Sistem Informasi Manajemen Pendataan
<br>
Armada Nelayan

</p>

</div>

</div>

<img
src="../logo-simpan.png"
class="logo-simpan"
>

</div>

<!-- QR SECTION -->

<div class="qr-section">

<!-- QR -->

<div class="qr-box">

<div id="qrcode"></div>

</div>

<!-- INFO -->

<div class="info">

<!-- ID -->

<div class="id-box">

<h2 id="idText">
BT-SMP-0001
</h2>

</div>

<!-- DETAIL -->

<div class="detail-box">

<div class="detail-item">

<h3>
👤 Pemilik :
</h3>

<p id="namaPemilik">
-
</p>

</div>

<div class="detail-item">

<h3>
🚢 Nama Kapal :
</h3>

<p id="namaKapal">
-
</p>

</div>

<div class="detail-item">

<h3>
📅 Tanggal Cetak :
</h3>

<p id="tanggal">
-
</p>

</div>

</div>

</div>

</div>

<!-- FOOTER -->

<div class="footer">

<h3>
SCAN QR UNTUK VERIFIKASI DATA KAPAL
</h3>

<p>

SIMPAN V1 • DINAS PERIKANAN KABUPATEN BANGKA TENGAH

</p>

</div>

</div>

<script>

/* ====================================================== */
/* CSV */
/* ====================================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSBI5O8DJD_-VoI2Bf3NDHY_x1eFO8vQgrmpw7L1VW_HczX9avlE5HVX2yN16nRQ8gq_UD0xp_wWfvk/pub?output=csv&t=" +
new Date().getTime();

/* ====================================================== */
/* URL PARAM */
/* ====================================================== */

const params =
new URLSearchParams(
window.location.search
);

let id =
params.get("id") ||
"BT-SMP-0001";

/* ====================================================== */
/* DATE */
/* ====================================================== */

document.getElementById(
"tanggal"
).innerHTML =

new Date().toLocaleDateString(
"id-ID"
);

/* ====================================================== */
/* LOAD CSV */
/* ====================================================== */

Papa.parse(csvUrl,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

const data = result.data;

/* ====================================================== */
/* FIND DATA */
/* ====================================================== */

const kapal = data.find(item =>

(item["ID SIMPAN"] || "")
.toString()
.trim()
.toUpperCase()

===

id.toUpperCase()

);

/* ====================================================== */
/* SET DATA */
/* ====================================================== */

if(kapal){

document.getElementById(
"idText"
).innerHTML =

kapal["ID SIMPAN"] || "-";

document.getElementById(
"namaPemilik"
).innerHTML =

kapal["Nama Pemilik Kapal (Sesuai KTP)"] || "-";

document.getElementById(
"namaKapal"
).innerHTML =

kapal["Nama Kapal"] || "-";

}

/* ====================================================== */
/* QR */
/* ====================================================== */

QRCode.toCanvas(

document.createElement("canvas"),

window.location.origin +
"/simpanv2/v1/kapal.html?id=" +
id,

{
width:430
},

function(err,canvas){

if(err){

console.log(err);

return;

}

document
.getElementById("qrcode")
.innerHTML = "";

document
.getElementById("qrcode")
.appendChild(canvas);

}

);

}

});

/* ====================================================== */
/* SEARCH */
/* ====================================================== */

function cariQR(){

const input =
document.getElementById(
"searchInput"
)
.value
.trim();

if(!input){

alert(
"Masukkan 4 digit ID belakang"
);

return;

}

window.location.href =
"?id=BT-SMP-" + input;

}

/* ====================================================== */
/* ENTER */
/* ====================================================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

cariQR();

}

}
);

/* ====================================================== */
/* DOWNLOAD PNG */
/* ====================================================== */

function downloadPNG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".png";

link.href =
canvas.toDataURL();

link.click();

});

}

/* ====================================================== */
/* DOWNLOAD JPG */
/* ====================================================== */

function downloadJPG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".jpg";

link.href =
canvas.toDataURL(
"image/jpeg"
);

link.click();

});

}

</script>

</body>
</html>
