<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>QR STIKER SIMPAN V1 FINAL</title>

<!-- ======================================================
FONT
====================================================== -->

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<!-- ======================================================
QR CODE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- ======================================================
PAPAPARSE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- ======================================================
HTML2CANVAS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* ======================================================
RESET
====================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ======================================================
BODY
====================================================== */

body{

font-family:'Poppins',sans-serif;

background:

linear-gradient(
135deg,
#dfe8f5,
#c9d8ec
);

min-height:100vh;

padding:30px;

display:flex;

flex-direction:column;

align-items:center;

overflow-x:hidden;

}

/* ======================================================
SEARCH
====================================================== */

.search-box{

display:flex;

gap:15px;

width:100%;

max-width:760px;

margin-bottom:25px;

}

.search-box input{

flex:1;

height:72px;

border:none;

outline:none;

padding:0 30px;

font-size:22px;

font-weight:600;

border-radius:24px;

background:white;

box-shadow:
0 10px 30px rgba(0,0,0,.10);

}

.search-box button{

width:230px;

border:none;

border-radius:24px;

background:

linear-gradient(
135deg,
#00c6ff,
#0072ff
);

color:white;

font-size:22px;

font-weight:800;

cursor:pointer;

transition:.3s;

box-shadow:
0 10px 30px rgba(0,0,0,.16);

}

.search-box button:hover{

transform:
translateY(-2px)
scale(1.02);

}

/* ======================================================
BUTTONS
====================================================== */

.actions{

display:flex;

gap:12px;

margin-bottom:22px;

flex-wrap:wrap;

justify-content:center;

}

.actions button{

padding:12px 22px;

border:none;

border-radius:14px;

background:

linear-gradient(
135deg,
#005eff,
#003cb3
);

color:white;

font-size:14px;

font-weight:700;

cursor:pointer;

transition:.3s;

box-shadow:
0 6px 18px rgba(0,0,0,.15);

}

.actions button:hover{

transform:
translateY(-2px);

}

/* ======================================================
QR CARD
====================================================== */

.card{

width:660px;

background:white;

border-radius:28px;

padding:35px;

position:relative;

overflow:hidden;

box-shadow:
0 20px 60px rgba(0,0,0,.18);

border:
6px solid #0a53be;

}

/* ======================================================
BACKGROUND
====================================================== */

.card::before{

content:"";

position:absolute;

inset:0;

background-image:url('../logo-simpan.png');

background-repeat:repeat;

background-size:160px;

opacity:.035;

pointer-events:none;

}

/* ======================================================
HEADER
====================================================== */

.header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:25px;

position:relative;
z-index:2;

}

.header-left{

display:flex;

align-items:center;

gap:18px;

}

.header-left img{

width:88px;
height:88px;

object-fit:contain;

}

.header-text h1{

font-size:32px;

font-weight:900;

line-height:1.2;

color:#003c99;

}

.header-text p{

font-size:15px;

font-weight:600;

color:#444;

margin-top:5px;

}

/* ======================================================
QR AREA
====================================================== */

.qr-area{

display:grid;

grid-template-columns:
300px 1fr;

gap:28px;

align-items:center;

position:relative;
z-index:2;

}

/* ======================================================
QR
====================================================== */

#qrcode{

display:flex;

justify-content:center;

align-items:center;

padding:15px;

background:white;

border-radius:20px;

border:
4px solid #005eff;

}

/* ======================================================
INFO
====================================================== */

.info{

display:flex;

flex-direction:column;

justify-content:center;

}

.id-box{

background:

linear-gradient(
135deg,
#005eff,
#003cb3
);

color:white;

padding:18px;

border-radius:18px;

margin-bottom:20px;

box-shadow:
0 10px 25px rgba(0,0,0,.15);

}

.id-box h2{

font-size:42px;

font-weight:900;

letter-spacing:1px;

line-height:1.1;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.detail{

background:
rgba(0,94,255,.06);

padding:20px;

border-radius:18px;

border:
1px solid rgba(0,94,255,.15);

}

.detail p{

font-size:16px;

margin-bottom:12px;

line-height:1.7;

color:#222;

}

.detail span{

font-weight:800;

color:#003c99;

}

/* ======================================================
FOOTER
====================================================== */

.footer{

margin-top:25px;

text-align:center;

position:relative;
z-index:2;

}

.footer h3{

font-size:18px;

font-weight:900;

color:#005eff;

margin-bottom:8px;

}

.footer p{

font-size:13px;

font-weight:600;

color:#444;

}

/* ======================================================
RESPONSIVE
====================================================== */

@media(max-width:760px){

.card{

width:100%;

padding:25px;

}

.qr-area{

grid-template-columns:1fr;

}

.header{

flex-direction:column;

gap:15px;

text-align:center;

}

.search-box{

flex-direction:column;

}

.search-box button{

width:100%;

}

.search-box input{

font-size:18px;

}

}

</style>

</head>

<body>

<!-- ======================================================
SEARCH
====================================================== -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan 4 digit ID belakang..."
>

<button onclick="cariQR()">

🔍 CARI QR

</button>

</div>

<!-- ======================================================
BUTTONS
====================================================== -->

<div class="actions">

<button onclick="downloadPNG()">
Download PNG
</button>

<button onclick="downloadJPG()">
Download JPG
</button>

<button onclick="window.print()">
Download PDF
</button>

</div>

<!-- ======================================================
QR CARD
====================================================== -->

<div class="card" id="card">

<!-- HEADER -->

<div class="header">

<div class="header-left">

<img src="../logo-bateng.png">

<div class="header-text">

<h1>

DINAS PERIKANAN
<br>
KABUPATEN BANGKA TENGAH

</h1>

<p>

Sistem Informasi Manajemen
Pendataan Armada Nelayan

</p>

</div>

</div>

<img
src="../logo-simpan.png"

style="
width:88px;
height:88px;
object-fit:contain;
"
>

</div>

<!-- QR AREA -->

<div class="qr-area">

<!-- QR -->

<div id="qrcode"></div>

<!-- INFO -->

<div class="info">

<div class="id-box">

<h2 id="idText">
BT-SMP-0001
</h2>

</div>

<div class="detail">

<p>

👤 Pemilik :
<br>

<span id="namaPemilik">
-
</span>

</p>

<p>

🚢 Nama Kapal :
<br>

<span id="namaKapal">
-
</span>

</p>

<p>

📅 Tanggal Cetak :
<br>

<span id="tanggal">
-
</span>

</p>

</div>

</div>

</div>

<!-- FOOTER -->

<div class="footer">

<h3>
SCAN QR UNTUK VERIFIKASI DATA KAPAL
</h3>

<p>

SIMPAN V1 • DINAS PERIKANAN KABUPATEN BANGKA TENGAH

</p>

</div>

</div>

<script>

/* ======================================================
CSV
====================================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSBI5O8DJD_-VoI2Bf3NDHY_x1eFO8vQgrmpw7L1VW_HczX9avlE5HVX2yN16nRQ8gq_UD0xp_wWfvk/pub?output=csv&t=" +
new Date().getTime();

/* ======================================================
PARAMETER
====================================================== */

const params =
new URLSearchParams(
window.location.search
);

let id =
params.get("id") ||
"BT-SMP-0001";

/* ======================================================
TANGGAL
====================================================== */

document.getElementById(
"tanggal"
).innerHTML =

new Date().toLocaleDateString(
"id-ID"
);

/* ======================================================
LOAD CSV
====================================================== */

Papa.parse(csvUrl,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

const data = result.data;

/* ======================================================
CARI DATA
====================================================== */

const kapal = data.find(item =>

(item["ID SIMPAN"] || "")
.toString()
.trim()
.toUpperCase()

===

id.toUpperCase()

);

/* ======================================================
JIKA ADA
====================================================== */

if(kapal){

document.getElementById(
"idText"
).innerHTML =

kapal["ID SIMPAN"] || "-";

document.getElementById(
"namaPemilik"
).innerHTML =

kapal["Nama Pemilik Kapal (Sesuai KTP)"] || "-";

document.getElementById(
"namaKapal"
).innerHTML =

kapal["Nama Kapal"] || "-";

}

/* ======================================================
QR GENERATE
====================================================== */

QRCode.toCanvas(

document.createElement("canvas"),

window.location.origin +
"/simpanv2/v1/kapal.html?id=" +
id,

{
width:260
},

function(err,canvas){

if(err){

console.log(err);

return;

}

document
.getElementById("qrcode")
.innerHTML = "";

document
.getElementById("qrcode")
.appendChild(canvas);

}

);

}

});

/* ======================================================
SEARCH
====================================================== */

function cariQR(){

const input =
document.getElementById(
"searchInput"
)
.value
.trim();

if(!input){

alert(
"Masukkan 4 digit ID belakang"
);

return;

}

window.location.href =
"?id=BT-SMP-" + input;

}

/* ======================================================
ENTER
====================================================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

cariQR();

}

}
);

/* ======================================================
DOWNLOAD PNG
====================================================== */

function downloadPNG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".png";

link.href =
canvas.toDataURL();

link.click();

});

}

/* ======================================================
DOWNLOAD JPG
====================================================== */

function downloadJPG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".jpg";

link.href =
canvas.toDataURL(
"image/jpeg"
);

link.click();

});

}

</script>

</body>
</html>
