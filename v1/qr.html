<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>QR STIKER SIMPAN V1</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:

linear-gradient(
rgba(230,235,245,.95),
rgba(210,220,235,.95)
);

min-height:100vh;

padding:30px;

display:flex;

flex-direction:column;

align-items:center;

}

/* ======================================================
SEARCH
====================================================== */

.search-box{

display:flex;

gap:12px;

width:100%;

max-width:760px;

margin-bottom:25px;

}

.search-box input{

flex:1;

height:70px;

border:none;

outline:none;

padding:0 28px;

font-size:22px;

font-weight:600;

border-radius:22px;

background:white;

box-shadow:
0 8px 25px rgba(0,0,0,.10);

}

.search-box button{

width:220px;

border:none;

border-radius:22px;

background:

linear-gradient(
135deg,
#00c6ff,
#0072ff
);

color:white;

font-size:22px;

font-weight:800;

cursor:pointer;

transition:.3s;

box-shadow:
0 8px 25px rgba(0,0,0,.15);

}

.search-box button:hover{

transform:
translateY(-2px)
scale(1.02);

}

/* ======================================================
BUTTONS
====================================================== */

.actions{

margin-bottom:18px;

display:flex;

gap:10px;

flex-wrap:wrap;

justify-content:center;

}

.actions button{

padding:12px 18px;

border:none;

border-radius:10px;

background:#005eff;

color:white;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.actions button:hover{

transform:translateY(-2px);

}

/* ======================================================
QR CARD
====================================================== */

.card{

width:430px;

background:white;

border:4px solid #111;

padding:28px;

position:relative;

overflow:hidden;

}

/* ======================================================
WATERMARK
====================================================== */

.card::before{

content:"";

position:absolute;

inset:0;

background-image:url('../logo-simpan.png');

background-size:130px;

background-repeat:repeat;

opacity:.04;

pointer-events:none;

}

/* ======================================================
HEADER
====================================================== */

.header{

text-align:center;

margin-bottom:14px;

position:relative;
z-index:2;

}

.header img{

width:70px;

margin-bottom:12px;

}

.header h1{

font-size:18px;

font-weight:900;

line-height:1.3;

}

/* ======================================================
QR
====================================================== */

#qrcode{

display:flex;

justify-content:center;

margin:18px 0;

position:relative;
z-index:2;

}

/* ======================================================
TEXT
====================================================== */

.info{

text-align:center;

position:relative;
z-index:2;

}

.info h2{

font-size:24px;

margin-bottom:10px;

font-weight:900;

}

.info p{

font-size:14px;

line-height:1.7;

}

.footer{

margin-top:14px;

text-align:center;

font-size:12px;

font-weight:700;

position:relative;
z-index:2;

}

/* ======================================================
RESPONSIVE
====================================================== */

@media(max-width:600px){

.card{

width:100%;

}

.search-box{

flex-direction:column;

}

.search-box button{

width:100%;

}

.search-box input{

font-size:18px;

}

}

</style>

</head>

<body>

<!-- ======================================================
SEARCH
====================================================== -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan 4 digit ID belakang..."
>

<button onclick="cariQR()">

🔍 CARI QR

</button>

</div>

<!-- ======================================================
BUTTONS
====================================================== -->

<div class="actions">

<button onclick="downloadPNG()">
Download PNG
</button>

<button onclick="downloadJPG()">
Download JPG
</button>

<button onclick="window.print()">
Download PDF
</button>

</div>

<!-- ======================================================
QR CARD
====================================================== -->

<div class="card" id="card">

<div class="header">

<img src="../logo-bateng.png">

<h1>

DINAS PERIKANAN
<br>
KABUPATEN BANGKA TENGAH

</h1>

</div>

<div id="qrcode"></div>

<div class="info">

<h2 id="idText">
BT-SMP-0001
</h2>

<p>

NAMA : <span id="namaPemilik">
-
</span>

<br>

KAPAL : <span id="namaKapal">
-
</span>

</p>

</div>

<div class="footer">

SCAN UNTUK VERIFIKASI

<br>

<span id="tanggal"></span>

</div>

</div>

<script>

/* ======================================================
CSV V1
====================================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSBI5O8DJD_-VoI2Bf3NDHY_x1eFO8vQgrmpw7L1VW_HczX9avlE5HVX2yN16nRQ8gq_UD0xp_wWfvk/pub?output=csv&t=" +
new Date().getTime();

/* ======================================================
AMBIL ID
====================================================== */

const params =
new URLSearchParams(
window.location.search
);

let id =
params.get("id") ||
"BT-SMP-0001";

/* ======================================================
FORMAT TANGGAL
====================================================== */

document.getElementById(
"tanggal"
).innerHTML =

"Tanggal Cetak : " +

new Date().toLocaleDateString(
"id-ID"
);

/* ======================================================
LOAD CSV
====================================================== */

fetch(csvUrl)

.then(res=>res.text())

.then(csv=>{

const rows =
csv.split("\n");

const headers =
rows[0]
.split(",");

const data = rows
.slice(1)
.map(r=>r.split(","));

const indexId =
headers.indexOf("ID SIMPAN");

const indexNama =
headers.indexOf(
"Nama Pemilik Kapal (Sesuai KTP)"
);

const indexKapal =
headers.indexOf(
"Nama Kapal"
);

let found = null;

data.forEach(row=>{

if(
(row[indexId] || "")
.trim()
.toUpperCase() ===
id.toUpperCase()
){

found = row;

}

});

if(found){

document.getElementById(
"idText"
).innerHTML =
found[indexId];

document.getElementById(
"namaPemilik"
).innerHTML =
found[indexNama];

document.getElementById(
"namaKapal"
).innerHTML =
found[indexKapal];

}

/* ======================================================
QR
====================================================== */

QRCode.toCanvas(

document.createElement("canvas"),

window.location.origin +
"/simpanv2/v1/kapal.html?id=" +
id,

{
width:260
},

function(err,canvas){

if(err) return;

document
.getElementById("qrcode")
.appendChild(canvas);

}

);

});

/* ======================================================
SEARCH
====================================================== */

function cariQR(){

const input =
document.getElementById(
"searchInput"
)
.value
.trim();

if(!input){

alert(
"Masukkan ID"
);

return;

}

window.location.href =
"?id=BT-SMP-" + input;

}

/* ======================================================
ENTER
====================================================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

cariQR();

}

}
);

/* ======================================================
DOWNLOAD PNG
====================================================== */

function downloadPNG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".png";

link.href =
canvas.toDataURL();

link.click();

});

}

/* ======================================================
DOWNLOAD JPG
====================================================== */

function downloadJPG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".jpg";

link.href =
canvas.toDataURL(
"image/jpeg"
);

link.click();

});

}

</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
