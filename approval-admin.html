}

}

appId:

};

const app =

const db =

/* ==========================
EMAILJS
========================== */

async function kirimEmail(
nama,
email,
username,
status
){

try{

const response =
await emailjs.send(
"service_ytswh42",
"template_6wp27aj",

}
);

catch(error){

/* ==========================
CEK SUPER ADMIN
========================== */

const role =
localStorage.getItem("role");

const username =
localStorage.getItem("username");

if(
role !== "superadmin" ||
username !== "sampandiperkan"
){

alert(
"Akses ditolak"
);

window.location.href =
"index.html";

}

/* ==========================
LOAD DATA PENDING
========================== */

async function loadPending(){

const container =
document.getElementById(
"pendingList"
);

container.innerHTML = "";

const q =
query(
collection(db,"users"),
where(
"role",
"==",
"admin"
),
where(
"status",
"==",
"pending"
)
);

const snapshot =
await getDocs(q);

if(
snapshot.empty
){

container.innerHTML =

`
<div class="empty">
Tidak ada akun yang menunggu persetujuan.
</div>
`;

return;

}

snapshot.forEach(docSnap=>{

const data =
docSnap.data();

const docId =
docSnap.id;

container.innerHTML +=

`
<div class="card">

<h3>
${data.username}
</h3>

<p>
<b>Nama :</b>
${data.nama}
</p>

<p>
<b>Email :</b>
${data.email}
</p>

<p>
<b>No HP :</b>
${data.nohp}
</p>

<div class="actions">

<button
class="approve"
onclick="approveAdmin('${docId}')">

SETUJUI

</button>

<button
class="reject"
onclick="rejectAdmin('${docId}')">

TOLAK

</button>

</div>

</div>
`;

});

}

/* ==========================
SETUJUI
========================== */

window.approveAdmin =
async function(docId){

if(
!confirm(
"Setujui akun ini?"
)
){
return;
}

const docRef =
doc(db,"users",docId);

const snap =
await getDoc(docRef);

const data =
snap.data();

await updateDoc(
docRef,
{
status:"active"
}
);

await kirimEmail(
data.nama,
data.email,
data.username,
"DISETUJUI"
);

alert(
"Akun berhasil disetujui dan email telah dikirim"
);

loadPending();

}

/* ==========================
TOLAK
========================== */

window.rejectAdmin =
async function(docId){

if(
!confirm(
"Tolak akun ini?"
)
){
return;
}

const docRef =
doc(db,"users",docId);

const snap =
await getDoc(docRef);

const data =
snap.data();

await kirimEmail(
data.nama,
data.email,
data.username,
"DITOLAK"
);

await deleteDoc(docRef);

alert(
"Akun berhasil ditolak dan email telah dikirim"
);

loadPending();

}

/* ==========================
LOAD
========================== */

loadPending();

</script>
