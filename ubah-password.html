<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ubah Password SAMPAN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(7,24,66,.85),rgba(7,24,66,.85)),
url('background_simpan.png');
background-size:cover;
background-position:center;
color:white;
}

.container{
width:450px;
background:rgba(255,255,255,.10);
backdrop-filter:blur(10px);
padding:35px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
position:relative;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
outline:none;
padding-right:50px;
}

.toggle{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
user-select:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#10a4ff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0c8ae0;
}

.back{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>UBAH PASSWORD</h1>

<div class="input-group">
<input
type="password"
id="passwordLama"
placeholder="Password Lama">
<span
class="toggle"
onclick="togglePassword('passwordLama',this)">
👁️
</span>
</div>

<div class="input-group">
<input
type="password"
id="passwordBaru"
placeholder="Password Baru">
<span
class="toggle"
onclick="togglePassword('passwordBaru',this)">
👁️
</span>
</div>

<div class="input-group">
<input
type="password"
id="konfirmasi"
placeholder="Konfirmasi Password Baru">
<span
class="toggle"
onclick="togglePassword('konfirmasi',this)">
👁️
</span>
</div>

<button onclick="ubahPassword()">
SIMPAN PASSWORD BARU
</button>

<a
href="index.html"
class="back">
Kembali ke Dashboard
</a>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyC0keS7m61O00Mdy56ysVneDj1y-4wETXE",

authDomain:
"sampan-2c37b.firebaseapp.com",

projectId:
"sampan-2c37b",

storageBucket:
"sampan-2c37b.firebasestorage.app",

messagingSenderId:
"498237273172",

appId:
"1:498237273172:web:baefb8ea7a0a4e4e9d69c1"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.ubahPassword =
async function(){

const username =
localStorage.getItem("username");

if(!username){

alert(
"Silakan login terlebih dahulu"
);

window.location.href =
"login.html";

return;

}

const passwordLama =
document.getElementById(
"passwordLama"
).value.trim();

const passwordBaru =
document.getElementById(
"passwordBaru"
).value.trim();

const konfirmasi =
document.getElementById(
"konfirmasi"
).value.trim();

if(
!passwordLama ||
!passwordBaru ||
!konfirmasi
){

alert(
"Semua data wajib diisi"
);

return;

}

if(
passwordBaru !== konfirmasi
){

alert(
"Konfirmasi password tidak cocok"
);

return;

}

try{

const q =
query(
collection(db,"users"),
where(
"username",
"==",
username
)
);

const snapshot =
await getDocs(q);

if(snapshot.empty){

alert(
"User tidak ditemukan"
);

return;

}

const docSnap =
snapshot.docs[0];

const data =
docSnap.data();

if(
data.password !==
passwordLama
){

alert(
"Password lama salah"
);

return;

}

await updateDoc(
doc(
db,
"users",
docSnap.id
),
{
password:
passwordBaru
}
);

alert(
"Password berhasil diperbarui"
);

window.location.href =
"index.html";

}
catch(error){

console.error(error);

alert(
"Gagal mengubah password"
);

}

}

window.togglePassword =
function(id,icon){

const input =
document.getElementById(id);

if(
input.type ===
"password"
){

input.type =
"text";

icon.innerHTML =
"🙈";

}
else{

input.type =
"password";

icon.innerHTML =
"👁️";

}

}

</script>

</body>
</html>
