<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>SAMPAN - Verifikasi Kapal Nelayan</title>

  <!-- AUTO REDIRECT -->
  <meta http-equiv="refresh" content="4; url=https://forms.gle/ivkhbQwhcP2USu556">

  <!-- FAVICON -->
  <link rel="icon" type="image/png"
  href="https://raw.githubusercontent.com/simpandiperkan-ux/simpanv2/main/logo-sampan.png">

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      height:100vh;

      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      font-family:'Poppins', sans-serif;

      position:relative;

      background:
      linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.72)),
      url('https://raw.githubusercontent.com/simpandiperkan-ux/simpanv2/main/background_simpan.png');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

    }

    /* ANIMATED BACKGROUND */

    .bg-animation{

      position:absolute;
      width:100%;
      height:100%;

      overflow:hidden;

      z-index:1;

    }

    .circle{

      position:absolute;

      border-radius:50%;

      background:rgba(255,255,255,.05);

      animation:float 15s linear infinite;

      bottom:-150px;

    }

    .circle:nth-child(1){
      left:10%;
      width:80px;
      height:80px;
      animation-duration:18s;
    }

    .circle:nth-child(2){
      left:25%;
      width:140px;
      height:140px;
      animation-duration:24s;
    }

    .circle:nth-child(3){
      left:45%;
      width:60px;
      height:60px;
      animation-duration:14s;
    }

    .circle:nth-child(4){
      left:65%;
      width:120px;
      height:120px;
      animation-duration:22s;
    }

    .circle:nth-child(5){
      left:82%;
      width:90px;
      height:90px;
      animation-duration:17s;
    }

    @keyframes float{

      0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }

      20%{
        opacity:1;
      }

      100%{
        transform:translateY(-1200px) rotate(720deg);
        opacity:0;
      }

    }

    /* MAIN CARD */

    .container{

      position:relative;
      z-index:10;

      width:92%;
      max-width:440px;

      padding:38px 28px;

      border-radius:32px;

      text-align:center;

      background:rgba(255,255,255,.08);

      border:1px solid rgba(255,255,255,.12);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      box-shadow:
      0 10px 40px rgba(0,0,0,.45);

      animation:fadeIn 1.3s ease;

    }

    /* LOGO PEMDA */

    .logo-pemda{

      width:78px;

      margin-bottom:16px;

      animation:fadeDown 1s ease;

    }

    /* LOGO SAMPAN */

    .logo{

      width:120px;

      margin-bottom:20px;

      animation:logoFloat 3s ease-in-out infinite;

      filter:drop-shadow(0 0 15px rgba(255,255,255,.25));

    }

    h1{

      color:white;

      font-size:38px;

      font-weight:800;

      letter-spacing:2px;

      margin-bottom:10px;

    }

    .subtitle{

      color:rgba(255,255,255,.92);

      font-size:15px;

      line-height:1.7;

      margin-bottom:30px;

    }

    /* LOADER */

    .loader{

      width:70px;
      height:70px;

      margin:auto;

      border-radius:50%;

      border:5px solid rgba(255,255,255,.12);

      border-top:5px solid #ffffff;

      animation:spin 1s linear infinite;

    }

    .loading-text{

      margin-top:18px;

      color:white;

      font-size:14px;

      letter-spacing:.5px;

      opacity:.9;

    }

    .status{

      margin-top:18px;

      display:inline-block;

      padding:8px 18px;

      border-radius:50px;

      background:rgba(34,197,94,.15);

      border:1px solid rgba(34,197,94,.4);

      color:#bbf7d0;

      font-size:12px;

      font-weight:600;

      letter-spacing:.5px;

    }

    .footer{

      margin-top:28px;

      color:rgba(255,255,255,.75);

      font-size:12px;

      line-height:1.7;

    }

    /* ANIMATION */

    @keyframes spin{

      100%{
        transform:rotate(360deg);
      }

    }

    @keyframes logoFloat{

      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-10px);
      }

    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    @keyframes fadeDown{

      from{
        opacity:0;
        transform:translateY(-20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    /* MOBILE */

    @media(max-width:480px){

      .container{

        padding:32px 22px;

      }

      h1{

        font-size:30px;

      }

      .subtitle{

        font-size:14px;

      }

      .logo{

        width:105px;

      }

      .logo-pemda{

        width:68px;

      }

    }

  </style>

</head>

<body>

  <!-- BACKGROUND ANIMATION -->

  <div class="bg-animation">

    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

  </div>

  <!-- MAIN CONTENT -->

  <div class="container">

    <!-- LOGO PEMDA -->

    <img
      src="https://raw.githubusercontent.com/simpandiperkan-ux/simpanv2/main/logo-bateng.png"
      class="logo-pemda"
      alt="Logo Bangka Tengah"
    >

    <!-- LOGO SAMPAN -->

    <img
      src="https://raw.githubusercontent.com/simpandiperkan-ux/simpanv2/main/logo-sampan.png"
      class="logo"
      alt="Logo SAMPAN"
    >

    <h1>SAMPAN</h1>

    <div class="subtitle">

      Sistem Administrasi Manajemen Pendataan Armada Nelayan
      <br>
      Verifikasi Kapal Nelayan Kabupaten Bangka Tengah

    </div>

    <!-- LOADER -->

    <div class="loader"></div>

    <div class="loading-text">

      Menghubungkan ke Sistem Verifikasi...

    </div>

    <div class="status">

      ● SERVER ONLINE

    </div>

    <div class="footer">

      Dinas Perikanan Kabupaten Bangka Tengah
      <br>
      © 2026 All Rights Reserved

    </div>

  </div>

  <!-- AUTO REDIRECT -->

  <script>

    setTimeout(function(){

      window.location.href =
      "https://forms.gle/ivkhbQwhcP2USu556";

    }, 4000);

  </script>

</body>
</html>
