<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SIMPAN - Verifikasi Kapal</title>

  <!-- AUTO REDIRECT -->
  <meta http-equiv="refresh" content="0; url=https://forms.gle/ivkhbQwhcP2USu556" />

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e3a8a);
      color:white;
      text-align:center;
    }

    .logo{
      width:110px;
      margin-bottom:20px;
      animation:float 2s ease-in-out infinite;
    }

    h1{
      margin:0;
      font-size:28px;
      letter-spacing:1px;
    }

    p{
      opacity:.9;
      margin-top:10px;
      font-size:14px;
    }

    .loader{
      margin-top:25px;
      width:45px;
      height:45px;
      border:4px solid rgba(255,255,255,.2);
      border-top:4px solid white;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-8px);
      }
    }
  </style>
</head>

<body>

  <!-- GANTI DENGAN LOGO SIMPAN -->
  <img 
    class="logo"
    src="https://cdn-icons-png.flaticon.com/512/3079/3079165.png"
    alt="Logo SIMPAN"
  >

  <h1>SIMPAN</h1>
  <p>Mengarahkan ke Form Verifikasi Kapal...</p>

  <div class="loader"></div>

    window.location.href = "https://forms.gle/ivkhbQwhcP2USu556";
  </script>

</body>
