<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login SAMPAN SUPER APP V3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(7,24,66,.85),rgba(7,24,66,.85)),
url('background_simpan.png');
background-size:cover;
background-position:center;
color:white;
}

.login-container{
width:420px;
background:rgba(255,255,255,.10);
backdrop-filter:blur(10px);
padding:35px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,.3);
text-align:center;
}

.logo{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.logo img{
width:70px;
height:auto;
}

h1{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.subtitle{
font-size:14px;
line-height:1.6;
color:#e8f0ff;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
outline:none;
}

.login-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#10a4ff;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
margin-top:5px;
}

.login-btn:hover{
background:#1db8ff;
}

.google-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:white;
color:#333;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:15px;
}

.google-btn:hover{
background:#f2f2f2;
}

.divider{
margin:20px 0;
font-size:13px;
color:#ddd;
}

.footer{
margin-top:20px;
font-size:12px;
color:#d9e4ff;
}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">
<img src="logo-bateng.png">
<img src="logo-sampan.png">
</div>

<h1>SAMPAN V3</h1>

<div class="subtitle">
Sistem Administrasi Manajemen<br>
Pendataan Armada Nelayan<br>
Kabupaten Bangka Tengah
</div>

<div class="input-group">
<input
type="text"
id="username"
placeholder="Username">
</div>

<div class="input-group">
<input
type="password"
id="password"
placeholder="Password">
</div>

<button
class="login-btn"
onclick="loginManual()">
LOGIN
</button>

<div class="divider">
──────── ATAU ────────
</div>

<button
class="google-btn"
onclick="loginGoogle()">
🔵 LOGIN DENGAN GOOGLE
</button>

<div class="footer">
SAMPAN SUPER APP V3
</div>

</div>

<script>

/* ==========================
SUPER ADMIN
========================== */

const SUPER_ADMIN =
"simpandiperkan@gmail.com";

/* ==========================
ADMIN
========================== */

const ADMINS = [

"admin01@gmail.com",
"admin02@gmail.com",
"admin03@gmail.com"

];

/* ==========================
LOGIN MANUAL
========================== */

function loginManual(){

const username =
document.getElementById("username")
.value
.trim();

const password =
document.getElementById("password")
.value
.trim();

/* SUPER ADMIN */

if(
username === "superadmin" &&
password === "super123"
){

localStorage.setItem(
"role",
"superadmin"
);

localStorage.setItem(
"user",
SUPER_ADMIN
);

window.location.href =
"index.html";

return;

}

/* ADMIN */

if(
username === "admin" &&
password === "admin123"
){

localStorage.setItem(
"role",
"admin"
);

localStorage.setItem(
"user",
"admin"
);

window.location.href =
"index.html";

return;

}

alert(
"Username atau Password Salah"
);

}

/* ==========================
LOGIN GOOGLE
========================== */

function loginGoogle(){

alert(
"Hubungkan ke Firebase Authentication untuk Login Google."
);

}

/* ==========================
SUDAH LOGIN
========================== */

if(
localStorage.getItem("role")
){

window.location.href =
"index.html";

}

</script>

</body>
</html>
