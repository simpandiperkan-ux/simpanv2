```html
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login SAMPAN SUPER APP V3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(7,24,66,.85),rgba(7,24,66,.85)),
url('background_simpan.png');
background-size:cover;
background-position:center;
color:white;
}

.login-container{
width:420px;
background:rgba(255,255,255,.10);
backdrop-filter:blur(10px);
padding:35px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,.3);
text-align:center;
}

.logo{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.logo img{
width:70px;
height:auto;
}

h1{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.subtitle{
font-size:14px;
line-height:1.6;
color:#e8f0ff;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
outline:none;
}

.login-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#10a4ff;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.google-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:white;
color:#333;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:15px;
}

.register-btn{
display:block;
margin-top:15px;
color:#fff;
text-decoration:none;
font-size:14px;
}

.divider{
margin:20px 0;
font-size:13px;
color:#ddd;
}

.footer{
margin-top:20px;
font-size:12px;
color:#d9e4ff;
}

.password-group{
position:relative;
}

.password-group input{
padding-right:50px;
}

.toggle-password{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:18px;
user-select:none;
color:#333;
}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">
<img src="logo-bateng.png">
<img src="logo-sampan.png">
</div>

<h1>SAMPAN V3</h1>

<div class="subtitle">
Sistem Administrasi Manajemen<br>
Pendataan Armada Nelayan<br>
Kabupaten Bangka Tengah
</div>

<div class="input-group">
<input
type="text"
id="username"
placeholder="Username">
</div>

<div class="input-group password-group">

<input
type="password"
id="password"
placeholder="Password">

<span
id="eyeIcon"
class="toggle-password"
onclick="togglePassword()">
👁️
</span>

</div>

<button
class="login-btn"
onclick="loginManual()">
LOGIN
</button>

<a
href="register.html"
class="register-btn">
DAFTAR AKUN ADMIN
</a>

<div class="divider">
──────── ATAU ────────
</div>

<button
class="google-btn"
onclick="loginGoogle()">
🔵 LOGIN DENGAN GOOGLE
</button>

<div class="footer">
SAMPAN SUPER APP V3
</div>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyC0keS7m61O00Mdy56ysVneDj1y-4wETXE",

authDomain:
"sampan-2c37b.firebaseapp.com",

projectId:
"sampan-2c37b",

storageBucket:
"sampan-2c37b.firebasestorage.app",

messagingSenderId:
"498237273172",

appId:
"1:498237273172:web:baefb8ea7a0a4e4e9d69c1"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

/* ==========================
LOGIN USERNAME PASSWORD
========================== */

window.loginManual =
async function(){

const username =
document
.getElementById("username")
.value
.trim();

const password =
document
.getElementById("password")
.value
.trim();

if(
!username ||
!password
){

alert(
"Username dan Password wajib diisi"
);

return;

}

try{

const q =
query(
collection(db,"users"),
where(
"username",
"==",
username
)
);

const snapshot =
await getDocs(q);

if(
snapshot.empty
){

alert(
"Username tidak ditemukan"
);

return;

}

const userData =
snapshot.docs[0].data();

if(
userData.status !==
"active"
){

alert(
"Akun belum disetujui Super Admin"
);

return;

}

await
signInWithEmailAndPassword(
auth,
userData.email,
password
);

localStorage.setItem(
"role",
userData.role
);

localStorage.setItem(
"username",
userData.username
);

localStorage.setItem(
"email",
userData.email
);

localStorage.setItem(
"status",
userData.status
);

window.location.href =
"index.html";

}
catch(error){

alert(
"Gagal Login : "
+
error.message
);

}

}

/* ==========================
LOGIN GOOGLE
========================== */

window.loginGoogle =
async function(){

try{

const provider =
new GoogleAuthProvider();

const result =
await signInWithPopup(
auth,
provider
);

const email =
result.user.email;

const q =
query(
collection(db,"users"),
where(
"email",
"==",
email
)
);

const snapshot =
await getDocs(q);

if(
snapshot.empty
){

alert(
"Akun Google belum terdaftar"
);

return;

}

const userData =
snapshot.docs[0].data();

if(
userData.status !==
"active"
){

alert(
"Akun belum disetujui"
);

return;

}

localStorage.setItem(
"role",
userData.role
);

localStorage.setItem(
"username",
userData.username
);

localStorage.setItem(
"email",
userData.email
);

localStorage.setItem(
"status",
userData.status
);

window.location.href =
"index.html";

}
catch(error){

alert(
error.message
);

}

}

/* ==========================
AUTO LOGIN
========================== */

if(
localStorage.getItem("role") &&
localStorage.getItem("status") === "active"
){

window.location.href =
"index.html";

}

/* TAMPILKAN / SEMBUNYIKAN PASSWORD */

window.togglePassword = function(){

const password =
document.getElementById("password");

const eyeIcon =
document.getElementById("eyeIcon");

if(password.type === "password"){

password.type = "text";
eyeIcon.innerHTML = "🙈";

}else{

password.type = "password";
eyeIcon.innerHTML = "👁️";

}

}

</script>

</body>
</html>
