<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIMPAN - Data Kapal</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f1f5f9;
    padding:20px;
}

.card{

    max-width:800px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);

}

.header{

    background:#0066cc;
    color:white;
    padding:30px;
    text-align:center;

}

.header h1{
    font-size:32px;
    margin-bottom:5px;
}

.header p{
    font-size:15px;
}

.content{
    padding:25px;
}

.item{

    background:#f7f7f7;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;

}

.label{

    font-weight:bold;
    color:#0066cc;
    margin-bottom:5px;
    font-size:14px;

}

.value{

    font-size:18px;
    word-break:break-word;

}

.foto{

    width:100%;
    border-radius:15px;
    margin-bottom:20px;
    border:3px solid #ddd;

}

.loading{

    text-align:center;
    font-size:22px;
    padding:50px;

}

.notfound{

    text-align:center;
    color:red;
    font-size:24px;
    padding:50px;

}

.footer{

    text-align:center;
    padding:20px;
    font-size:13px;
    color:#777;

}

</style>

</head>

<body>

<div class="card">

    <div class="header">

        <h1>SIMPAN</h1>

        <p>
            Sistem Informasi Manajemen Pendataan Armada Nelayan
        </p>

    </div>

    <div class="content" id="data">

        <div class="loading">
            Memuat data kapal...
        </div>

    </div>

    <div class="footer">

        Dinas Perikanan Kabupaten Bangka Tengah

    </div>

</div>

<script>

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

const container = document.getElementById("data");

Papa.parse(csvUrl, {

    download: true,

    header: true,

    skipEmptyLines: true,

    complete: function(results) {

        console.log(results.data);

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            container.innerHTML = "";

            // FOTO
            if(kapal["FOTO"]){

                const foto = document.createElement("img");

                foto.src = kapal["FOTO"];

                foto.className = "foto";

                container.appendChild(foto);

            }

            // TAMPILKAN DATA
            for(const key in kapal){

                // SEMBUNYIKAN NIK
                if(key.toUpperCase() === "NIK") continue;

                // FOTO SUDAH DITAMPILKAN
                if(key.toUpperCase() === "FOTO") continue;

                // SKIP DATA KOSONG
                if(kapal[key] === "") continue;

                const item = document.createElement("div");

                item.className = "item";

                item.innerHTML = `

                    <div class="label">
                        ${key}
                    </div>

                    <div class="value">
                        ${kapal[key]}
                    </div>

                `;

                container.appendChild(item);

            }

        }else{

            container.innerHTML = `

                <div class="notfound">

                    Data kapal tidak ditemukan

                </div>

            `;

        }

    },

    error: function(error){

        console.log(error);

        container.innerHTML = `

            <div class="notfound">

                Gagal membaca Spreadsheet

            </div>

        `;

    }

});

</script>

</body>
</html>
