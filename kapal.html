<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAMPAN - Data Kapal</title>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            rgba(255,255,255,0.08),
            rgba(0,40,90,0.35)
        ),
        url('background_simpan.png');

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    background-attachment:fixed;

    padding:20px;

    min-height:100vh;

    position:relative;

}

/* WATERMARK */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:url('logo-sampan.png');

    background-repeat:repeat;

    background-size:240px;

    opacity:0.025;

    z-index:-1;

}

/* CARD */

.card{

    max-width:1100px;

    margin:auto;

    background:rgba(255,255,255,0.96);

    backdrop-filter:blur(10px);

    border-radius:30px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,0.30);

    border:4px solid rgba(255,255,255,0.35);

}

/* HEADER */

.header{

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.98),
            rgba(225,240,255,0.96)
        );

    padding:35px;

    position:relative;

    overflow:hidden;

}

/* HEADER WATERMARK */

.header::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:url('logo-sampan.png');

    background-repeat:repeat;

    background-size:180px;

    opacity:0.04;

    z-index:1;

}

/* HEADER FLEX */

.header-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    position:relative;

    z-index:2;

}

/* TITLE */

.title-area{

    flex:1;

    text-align:center;

}

.title-area h1{

    font-size:58px;

    color:#002b70;

    margin-bottom:10px;

    font-weight:900;

    text-shadow:0 2px 4px rgba(0,0,0,0.08);

}

.title-area p{

    font-size:22px;

    color:#223;

}

/* LOGO */

.logo-kabupaten{

    width:110px;

    filter:drop-shadow(0 5px 10px rgba(0,0,0,0.2));

}

.logo-sampan{

    width:150px;

    filter:drop-shadow(0 5px 10px rgba(0,0,0,0.2));

}

/* CONTENT */

.content{

    padding:30px;

}

/* FOTO */

.foto{

    width:100%;

    border-radius:24px;

    margin-top:10px;

    border:5px solid white;

    box-shadow:0 10px 25px rgba(0,0,0,0.25);

    transition:0.3s;

}

.foto:hover{

    transform:scale(1.01);

}

/* ITEM */

.item{

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f5faff
        );

    border-radius:22px;

    padding:24px;

    margin-bottom:20px;

    box-shadow:0 5px 15px rgba(0,0,0,0.07);

    border-left:8px solid #0066cc;

    transition:0.3s;

}

.item:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(0,0,0,0.12);

}

/* LABEL */

.label{

    color:#0056b3;

    font-weight:900;

    margin-bottom:12px;

    font-size:15px;

    text-transform:uppercase;

    letter-spacing:0.5px;

}

/* VALUE */

.value{

    font-size:22px;

    color:#222;

    word-break:break-word;

    line-height:1.7;

}

/* BUTTON */

.btn-link{

    display:inline-block;

    padding:13px 24px;

    background:
        linear-gradient(
            135deg,
            #0056b3,
            #00a2ff
        );

    color:white;

    text-decoration:none;

    border-radius:14px;

    font-size:15px;

    font-weight:bold;

    transition:0.3s;

    box-shadow:0 5px 15px rgba(0,102,204,0.2);

}

.btn-link:hover{

    transform:scale(1.05);

}

/* BADGE */

.badge{

    display:inline-block;

    padding:10px 18px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #00aa55,
            #00cc66
        );

    color:white;

    font-size:14px;

    font-weight:bold;

    box-shadow:0 4px 10px rgba(0,170,85,0.25);

}

/* LOADING */

.loading{

    text-align:center;

    font-size:28px;

    padding:90px;

    color:#0066cc;

    font-weight:bold;

}

/* ERROR */

.notfound{

    text-align:center;

    color:red;

    font-size:28px;

    padding:90px;

    font-weight:bold;

}

/* FOOTER */

.footer{

    text-align:center;

    padding:25px;

    font-size:15px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #003b8f,
            #005ecb
        );

    font-weight:bold;

}

/* RESPONSIVE */

@media(max-width:768px){

    .header-top{

        flex-direction:column;

    }

    .title-area h1{

        font-size:34px;

    }

    .title-area p{

        font-size:15px;

    }

    .logo-kabupaten{

        width:80px;

    }

    .logo-sampan{

        width:105px;

    }

    .value{

        font-size:18px;

    }

    .content{

        padding:18px;

    }

}

</style>

</head>

<body>

<div class="card">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <!-- LOGO BATENG -->

            <img 
                src="logo-bateng.png"
                class="logo-kabupaten"
            >

            <!-- TITLE -->

            <div class="title-area">

                <h1>DATA KAPAL SAMPAN</h1>

                <p>
                    Sistem Administrasi Manajemen Pendataan Armada Nelayan
                </p>

            </div>

            <!-- LOGO SAMPAN -->

            <img 
                src="logo-sampan.png"
                class="logo-sampan"
            >

        </div>

    </div>

    <!-- CONTENT -->

    <div class="content" id="data">

        <div class="loading">

            Memuat data kapal...

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        © Dinas Perikanan Kabupaten Bangka Tengah

    </div>

</div>

<script>

/* =========================
CSV REALTIME NO CACHE
========================= */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv&t=" + new Date().getTime();

/* =========================
GET URL PARAM
========================= */

const params =
new URLSearchParams(window.location.search);

const kapalId =
params.get("id");

const container =
document.getElementById("data");

/* =========================
CONVERT GOOGLE DRIVE IMAGE
========================= */

function convertDriveImage(url){

    if(!url) return url;

    if(url.includes("drive.google.com")){

        const match =
        url.match(/[-\w]{25,}/);

        if(match){

            return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w1200`;

        }

    }

    return url;

}

/* =========================
LOAD CSV
========================= */

Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        /* =========================
        ID CLEANER
        ========================= */

        const kapal = data.find(item => {

            const sheetId =
            String(item["ID SAMPAN"] || "")
            .replace(/\s+/g,"")
            .trim()
            .toUpperCase();

            const urlId =
            String(kapalId || "")
            .replace(/\s+/g,"")
            .trim()
            .toUpperCase();

            return sheetId === urlId;

        });

        /* =========================
        DATA FOUND
        ========================= */

        if(kapal){

            container.innerHTML = "";

            for(const key in kapal){

                /* =========================
                HIDE COLUMN
                ========================= */

                if(

                    key.toUpperCase().includes("NIK") ||

                    key.toUpperCase() === "TIMESTAMP" ||

                    key.toUpperCase() === "LINK HALAMAN KAPAL" ||

                    key.toUpperCase() === "LINK QR"

                ) continue;

                let valueContent = kapal[key];

                /* EMPTY VALUE */

                if(
                    !valueContent ||
                    valueContent.trim() === ""
                ){

                    valueContent = "-";

                }

                /* =========================
                IMAGE COLUMN
                ========================= */

                if(

                    key.toUpperCase().includes("FOTO") ||

                    key.toUpperCase().includes("KARTU KUSUKA")

                ){

                    if(valueContent !== "-"){

                        const imageUrl =
                        convertDriveImage(kapal[key]);

                        valueContent = `

                            <a href="${kapal[key]}" target="_blank">

                                <img
                                    src="${imageUrl}"
                                    class="foto"
                                    loading="lazy"
                                >

                            </a>

                        `;

                    }

                }

                /* =========================
                DOCUMENT LINK
                ========================= */

                else if(

                    valueContent.startsWith("http://") ||

                    valueContent.startsWith("https://")

                ){

                    valueContent = `

                        <a
                            href="${kapal[key]}"
                            target="_blank"
                            class="btn-link"
                        >

                            Buka Dokumen

                        </a>

                    `;

                }

                /* =========================
                STATUS
                ========================= */

                if(
                    key.toUpperCase().includes("STATUS")
                ){

                    valueContent = `

                        <div class="badge">

                            ${kapal[key]}

                        </div>

                    `;

                }

                /* =========================
                CREATE ITEM
                ========================= */

                const item =
                document.createElement("div");

                item.className = "item";

                item.innerHTML = `

                    <div class="label">

                        ${key}

                    </div>

                    <div class="value">

                        ${valueContent}

                    </div>

                `;

                container.appendChild(item);

            }

        }

        /* =========================
        DATA NOT FOUND
        ========================= */

        else{

            container.innerHTML = `

                <div class="notfound">

                    Data kapal tidak ditemukan

                </div>

            `;

        }

    },

    /* =========================
    ERROR
    ========================= */

    error:function(error){

        console.log(error);

        container.innerHTML = `

            <div class="notfound">

                Gagal membaca Spreadsheet

            </div>

        `;

    }

});

</script>

</body>
</html>
