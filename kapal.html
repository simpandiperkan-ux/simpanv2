<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIMPAN - Data Kapal</title>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

    padding:20px;

    position:relative;

}

/* OVERLAY GELAP */
body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.45);

    z-index:-1;

}

.card{

    max-width:850px;
    margin:auto;

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(10px);

    border-radius:25px;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,0.25);

}

.header{

    background:linear-gradient(135deg,#0066cc,#0099ff);

    color:white;

    padding:35px;

    text-align:center;

}

.header h1{

    font-size:38px;

    margin-bottom:8px;

    letter-spacing:2px;

}

.header p{

    font-size:15px;

    opacity:0.95;

}

.content{

    padding:25px;

}

.item{

    background:white;

    border-radius:18px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:0 3px 10px rgba(0,0,0,0.05);

    transition:0.3s;

}

.item:hover{

    transform:translateY(-2px);

}

.label{

    color:#0066cc;

    font-weight:bold;

    margin-bottom:8px;

    font-size:14px;

    text-transform:uppercase;

}

.value{

    font-size:20px;

    word-break:break-word;

    color:#222;

}

.foto{

    width:100%;

    border-radius:20px;

    margin-bottom:20px;

    border:5px solid white;

    box-shadow:0 5px 20px rgba(0,0,0,0.2);

}

.loading{

    text-align:center;

    font-size:24px;

    padding:60px;

    color:#0066cc;

}

.notfound{

    text-align:center;

    color:red;

    font-size:24px;

    padding:60px;

}

.footer{

    text-align:center;

    padding:20px;

    font-size:13px;

    color:#555;

}

.btn-link{

    display:inline-block;

    padding:12px 20px;

    background:linear-gradient(135deg,#0066cc,#0099ff);

    color:white;

    text-decoration:none;

    border-radius:12px;

    font-size:15px;

    font-weight:bold;

    transition:0.3s;

}

.btn-link:hover{

    transform:scale(1.05);

    box-shadow:0 5px 15px rgba(0,102,204,0.3);

}

.badge{

    display:inline-block;

    padding:8px 15px;

    border-radius:20px;

    background:#00aa55;

    color:white;

    font-size:13px;

    font-weight:bold;

    margin-top:10px;

}

</style>

</head>

<body>

<div class="card">

    <div class="header">

        <h1>SIMPAN</h1>

        <p>
            Sistem Informasi Manajemen Pendataan Armada Nelayan
        </p>

        <div class="badge">
            DATA TERVERIFIKASI
        </div>

    </div>

    <div class="content" id="data">

        <div class="loading">
            Memuat data kapal...
        </div>

    </div>

    <div class="footer">

        © Dinas Perikanan Kabupaten Bangka Tengah

    </div>

</div>

<script>

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

const container = document.getElementById("data");

Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        console.log(data);

        // CARI DATA BERDASARKAN ID SIMPAN
        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        // JIKA DATA DITEMUKAN
        if(kapal){

            container.innerHTML = "";

            // FOTO KAPAL
            if(kapal["FOTO"]){

                const foto = document.createElement("img");

                foto.src = kapal["FOTO"];

                foto.className = "foto";

                container.appendChild(foto);

            }

            // LOOP DATA
            for(const key in kapal){

                // SEMBUNYIKAN NIK
                if(
                    key.toUpperCase().includes("NIK")
                ) continue;

                // FOTO SUDAH DI ATAS
                if(
                    key.toUpperCase() === "FOTO"
                ) continue;

                // SKIP KOSONG
                if(
                    kapal[key] === ""
                ) continue;

                let valueContent = kapal[key];

                // CEK LINK
                if(

                    valueContent.startsWith("http://") ||
                    valueContent.startsWith("https://")

                ){

                    valueContent = `

                        <a 
                            href="${kapal[key]}"
                            target="_blank"
                            class="btn-link"
                        >
                            Buka Dokumen
                        </a>

                    `;

                }

                // STATUS KAPAL
                if(
                    key.toUpperCase().includes("STATUS")
                ){

                    valueContent = `

                        <div class="badge">

                            ${kapal[key]}

                        </div>

                    `;

                }

                const item = document.createElement("div");

                item.className = "item";

                item.innerHTML = `

                    <div class="label">
                        ${key}
                    </div>

                    <div class="value">
                        ${valueContent}
                    </div>

                `;

                container.appendChild(item);

            }

        }else{

            container.innerHTML = `

                <div class="notfound">

                    Data kapal tidak ditemukan

                </div>

            `;

        }

    },

    error:function(error){

        console.log(error);

        container.innerHTML = `

            <div class="notfound">

                Gagal membaca Spreadsheet

            </div>

        `;

    }

});

</script>

</body>
</html>
