<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN</title>

<!-- QR CODE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:
        linear-gradient(
            rgba(255,255,255,0.15),
            rgba(0,60,120,0.20)
        ),
        url('https://simpandiperkan-ux.github.io/simpanv2/background_simpan.png');

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    background-attachment:fixed;

    min-height:100vh;

    padding:40px;

}

/* CONTAINER */
.container{

    width:850px;

    margin:auto;

    background:white;

    border-radius:30px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,0.30);

    border:8px solid #ffffff;

    position:relative;

}

/* WATERMARK */
.container::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background-image:url('https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png');

    background-repeat:repeat;

    background-size:180px;

    opacity:0.04;

    pointer-events:none;

}

/* HEADER */
.header{

    padding:35px 30px;

    text-align:center;

    position:relative;

    z-index:2;

}

/* LOGO AREA */
.logo-area{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}

/* LOGO */
.logo-kab{

    width:110px;

}

.logo-simpan{

    width:170px;

}

/* TITLE */
.title{

    text-align:center;

    flex:1;

}

.title h1{

    font-size:48px;

    color:#002b70;

    font-weight:900;

    margin-bottom:10px;

}

.title p{

    font-size:22px;

    color:#333;

}

/* QR AREA */
.qr-section{

    text-align:center;

    padding:20px 40px;

    position:relative;

    z-index:2;

}

/* QR BOX */
.qr-box{

    width:520px;

    height:520px;

    margin:auto;

    background:white;

    border-radius:20px;

    padding:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.15);

    border:8px solid #003b8f;

    display:flex;

    align-items:center;

    justify-content:center;

}

/* INFO */
.info{

    text-align:center;

    padding:25px 40px 10px;

    position:relative;

    z-index:2;

}

.id{

    font-size:60px;

    font-weight:900;

    color:#000;

    margin-bottom:15px;

}

.nama{

    font-size:30px;

    margin-bottom:8px;

    font-weight:bold;

}

.kapal{

    font-size:28px;

    margin-bottom:30px;

}

/* SCAN */
.scan{

    font-size:42px;

    font-weight:900;

    color:#000;

    margin-bottom:15px;

}

/* DATE */
.date{

    font-size:22px;

    color:#333;

    margin-bottom:30px;

}

/* BUTTON AREA */
.button-area{

    display:flex;

    gap:15px;

    padding:0 30px 30px;

    position:relative;

    z-index:2;

}

/* BUTTON */
.btn{

    flex:1;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #0047ab,
            #009dff
        );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

.btn:hover{

    transform:translateY(-2px);

}

/* LOADING */
.loading{

    text-align:center;

    font-size:28px;

    padding:100px;

    color:#0047ab;

    font-weight:bold;

}

/* RESPONSIVE */
@media(max-width:900px){

    body{

        padding:10px;

    }

    .container{

        width:100%;

    }

    .logo-area{

        flex-direction:column;

        gap:20px;

    }

    .title h1{

        font-size:32px;

    }

    .title p{

        font-size:16px;

    }

    .qr-box{

        width:100%;

        height:auto;

        padding:15px;

    }

    #qrcode img{

        width:100% !important;
        height:auto !important;

    }

    .id{

        font-size:36px;

    }

    .nama{

        font-size:22px;

    }

    .kapal{

        font-size:20px;

    }

    .scan{

        font-size:28px;

    }

    .date{

        font-size:16px;

    }

    .button-area{

        flex-direction:column;

    }

}

@media print{

    body{

        background:white;

        padding:0;

    }

    .button-area{

        display:none;

    }

    .container{

        width:100%;

        border:none;

        box-shadow:none;

    }

}

</style>

</head>

<body>

<div class="container" id="printArea">

    <div class="header">

        <div class="logo-area">

            <!-- LOGO BATENG -->
            <img 
                src="https://simpandiperkan-ux.github.io/simpanv2/logo-bateng.png"
                class="logo-kab"
            >

            <!-- TITLE -->
            <div class="title">

                <h1>QR STIKER SIMPAN</h1>

                <p>
                    Sistem Informasi Manajemen Pendataan Armada Nelayan
                </p>

            </div>

            <!-- LOGO SIMPAN -->
            <img 
                src="https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png"
                class="logo-simpan"
            >

        </div>

    </div>

    <!-- QR -->
    <div class="qr-section">

        <div class="qr-box">

            <div id="qrcode"></div>

        </div>

    </div>

    <!-- INFO -->
    <div class="info">

        <div class="id" id="idSimpan">
            MEMUAT...
        </div>

        <div class="nama" id="namaNelayan"></div>

        <div class="kapal" id="namaKapal"></div>

        <div class="scan">
            SCAN UNTUK VERIFIKASI
        </div>

        <div class="date" id="tanggalCetak"></div>

    </div>

    <!-- BUTTON -->
    <div class="button-area">

        <button class="btn" onclick="window.print()">
            🖨 CETAK QR
        </button>

        <button class="btn" onclick="downloadQR()">
            📥 DOWNLOAD
        </button>

    </div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

/* TANGGAL */
const now = new Date();

document.getElementById("tanggalCetak").innerHTML =
"Tanggal Cetak : " +
now.toLocaleDateString("id-ID");

/* LOAD DATA */
Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            // LINK QR
            const qrLink =
            "https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
            kapal["ID SIMPAN"];

            // QR CODE
            new QRCode(document.getElementById("qrcode"), {

                text:qrLink,

                width:450,

                height:450,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:QRCode.CorrectLevel.H

            });

            // DATA
            document.getElementById("idSimpan").innerHTML =
            kapal["ID SIMPAN"];

            document.getElementById("namaNelayan").innerHTML =
            "NAMA : " +
            (kapal["NAMA PEMILIK KAPAL (SESUAI KTP)"] || "-");

            document.getElementById("namaKapal").innerHTML =
            "KAPAL : " +
            (kapal["NAMA KAPAL SESUAI PAS KAPAL"] || "-");

        }else{

            document.body.innerHTML = `

                <div style="
                    text-align:center;
                    padding:100px;
                    font-size:35px;
                    font-weight:bold;
                    color:red;
                ">

                    DATA TIDAK DITEMUKAN

                </div>

            `;

        }

    }

});

/* DOWNLOAD */
function downloadQR(){

    html2canvas(document.querySelector("#printArea")).then(canvas => {

        const link = document.createElement("a");

        link.download = kapalId + ".png";

        link.href = canvas.toDataURL();

        link.click();

    });

}

</script>

<!-- HTML2CANVAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
