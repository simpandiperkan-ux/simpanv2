<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>KARTU SIMPAN V2 FINAL</title>

<!-- ====================================================== -->
<!-- FONT -->
<!-- ====================================================== -->

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<!-- ====================================================== -->
<!-- QR CODE -->
<!-- ====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- ====================================================== -->
<!-- PAPAPARSE -->
<!-- ====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- ====================================================== -->
<!-- HTML2CANVAS -->
<!-- ====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* ====================================================== */
/* RESET */
/* ====================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ====================================================== */
/* BODY */
/* ====================================================== */

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#dfe8f6,
#cad7ea
);

min-height:100vh;

padding:30px;

display:flex;

flex-direction:column;

align-items:center;

overflow-x:auto;

}

/* ====================================================== */
/* SEARCH */
/* ====================================================== */

.search-box{

display:flex;

gap:16px;

width:100%;

max-width:860px;

margin-bottom:20px;

}

.search-box input{

flex:1;

height:68px;

border:none;

outline:none;

padding:0 26px;

font-size:20px;

font-weight:700;

border-radius:18px;

background:white;

box-shadow:
0 10px 24px rgba(0,0,0,.10);

}

.search-box button{

width:220px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#0066ff,
#00a6ff
);

color:white;

font-size:20px;

font-weight:900;

cursor:pointer;

transition:.3s;

box-shadow:
0 10px 24px rgba(0,0,0,.16);

}

.search-box button:hover{

transform:
translateY(-2px);

}

/* ====================================================== */
/* ACTION BUTTON */
/* ====================================================== */

.actions{

display:flex;

gap:12px;

margin-bottom:20px;

flex-wrap:wrap;

justify-content:center;

}

.actions button{

padding:12px 22px;

border:none;

border-radius:12px;

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

color:white;

font-size:14px;

font-weight:800;

cursor:pointer;

transition:.3s;

box-shadow:
0 8px 20px rgba(0,0,0,.14);

}

.actions button:hover{

transform:
translateY(-2px);

}

/* ====================================================== */
/* CARD */
/* ====================================================== */

.card{

width:1011px;
height:638px;

background:white;

border-radius:30px;

padding:26px;

position:relative;

overflow:hidden;

border:
5px solid #005eff;

box-shadow:
0 24px 60px rgba(0,0,0,.18);

display:flex;

flex-direction:column;

justify-content:space-between;

}

/* ====================================================== */
/* WATERMARK */
/* ====================================================== */

.card::before{

content:"";

position:absolute;

inset:0;

background-image:url('logo-simpan.png');

background-repeat:repeat;

background-size:150px;

opacity:.03;

pointer-events:none;

}

/* ====================================================== */
/* HEADER */
/* ====================================================== */

.header{

display:grid;

grid-template-columns:
110px 1fr 110px;

align-items:center;

column-gap:16px;

padding-bottom:16px;

border-bottom:
2px solid rgba(0,94,255,.12);

position:relative;
z-index:2;

}

/* ====================================================== */
/* LOGO */
/* ====================================================== */

.logo-bateng{

width:88px;

display:block;

margin:auto;

object-fit:contain;

margin-top:8px;

}

.logo-simpan{

width:105px;

display:block;

margin:auto;

object-fit:contain;

}

/* ====================================================== */
/* HEADER TEXT */
/* ====================================================== */

.header-text{

text-align:center;

}

.header-text h1{

font-size:42px;

font-weight:900;

line-height:1.05;

color:#0047b3;

margin-bottom:10px;

}

.header-text p{

font-size:15px;

font-weight:500;

line-height:1.4;

color:#333;

}

/* ====================================================== */
/* MAIN */
/* ====================================================== */

.main{

display:grid;

grid-template-columns:
390px 1fr;

gap:22px;

align-items:center;

margin-top:16px;

position:relative;
z-index:2;

}

/* ====================================================== */
/* QR BOX */
/* ====================================================== */

.qr-box{

height:330px;

border:
4px solid #005eff;

border-radius:22px;

display:flex;

justify-content:center;

align-items:center;

padding:12px;

background:white;

}

/* ====================================================== */
/* RIGHT */
/* ====================================================== */

.right{

display:flex;

flex-direction:column;

gap:16px;

height:330px;

}

/* ====================================================== */
/* ID BOX */
/* ====================================================== */

.id-box{

height:72px;

border-radius:18px;

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

display:flex;

justify-content:center;

align-items:center;

padding:0 22px;

box-shadow:
0 8px 20px rgba(0,0,0,.16);

}

.id-box h2{

font-size:38px;

font-weight:900;

color:white;

white-space:nowrap;

line-height:1;

}

/* ====================================================== */
/* DETAIL BOX */
/* ====================================================== */

.detail-box{

flex:1;

border:
2px solid rgba(0,94,255,.10);

border-radius:20px;

padding:20px;

background:
rgba(0,94,255,.03);

display:flex;

flex-direction:column;

justify-content:center;

}

/* ====================================================== */
/* DETAIL ITEM */
/* ====================================================== */

.detail-item{

padding:10px 0;

border-bottom:
1px solid rgba(0,94,255,.10);

}

.detail-item:last-child{

border-bottom:none;

}

.detail-item h3{

font-size:13px;

font-weight:500;

color:#555;

margin-bottom:5px;

}

.detail-item p{

font-size:24px;

font-weight:800;

color:#0047b3;

line-height:1.3;

}

/* ====================================================== */
/* FOOTER */
/* ====================================================== */

.footer{

margin-top:12px;

padding-top:12px;

border-top:
2px solid rgba(0,94,255,.12);

text-align:center;

position:relative;
z-index:2;

}

.footer h3{

font-size:24px;

font-weight:900;

color:#005eff;

margin-bottom:6px;

}

.footer p{

font-size:13px;

font-weight:600;

color:#333;

}

/* ====================================================== */
/* RESPONSIVE */
/* ====================================================== */

@media(max-width:1100px){

.card{

width:100%;
height:auto;

}

.main{

grid-template-columns:1fr;

}

.right,
.qr-box{

height:auto;

}

.header{

grid-template-columns:1fr;

text-align:center;

gap:10px;

}

}

/* ====================================================== */
/* PRINT */
/* ====================================================== */

@media print{

body{

background:white;
padding:0;

}

.search-box,
.actions{

display:none;

}

.card{

box-shadow:none;

}

}

</style>

</head>

<body>

<!-- ====================================================== -->
<!-- SEARCH -->
<!-- ====================================================== -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan 4 digit ID belakang..."
>

<button onclick="cariQR()">

🔍 CARI QR

</button>

</div>

<!-- ====================================================== -->
<!-- BUTTON -->
<!-- ====================================================== -->

<div class="actions">

<button onclick="downloadPNG()">
🖼 Download PNG
</button>

<button onclick="downloadJPG()">
🖼 Download JPG
</button>

<button onclick="window.print()">
📄 Download PDF
</button>

</div>

<!-- ====================================================== -->
<!-- CARD -->
<!-- ====================================================== -->

<div class="card" id="card">

<!-- ====================================================== -->
<!-- HEADER -->
<!-- ====================================================== -->

<div class="header">

<!-- LOGO KIRI -->

<div>

<img
src="logo-bateng.png"
class="logo-bateng"
>

</div>

<!-- TEXT -->

<div class="header-text">

<h1>

DINAS PERIKANAN
<br>
KABUPATEN BANGKA TENGAH

</h1>

<p>

Sistem Informasi Manajemen Pendataan Armada Nelayan

</p>

</div>

<!-- LOGO KANAN -->

<div>

<img
src="logo-simpan.png"
class="logo-simpan"
>

</div>

</div>

<!-- ====================================================== -->
<!-- MAIN -->
<!-- ====================================================== -->

<div class="main">

<!-- QR -->

<div class="qr-box">

<div id="qrcode"></div>

</div>

<!-- RIGHT -->

<div class="right">

<!-- ID -->

<div class="id-box">

<h2 id="idText">
BT-SMP-0001
</h2>

</div>

<!-- DETAIL -->

<div class="detail-box">

<div class="detail-item">

<h3>
👤 Pemilik :
</h3>

<p id="namaPemilik">
-
</p>

</div>

<div class="detail-item">

<h3>
🚢 Nama Kapal :
</h3>

<p id="namaKapal">
-
</p>

</div>

<div class="detail-item">

<h3>
📅 Tanggal Cetak :
</h3>

<p id="tanggal">
-
</p>

</div>

</div>

</div>

</div>

<!-- ====================================================== -->
<!-- FOOTER -->
<!-- ====================================================== -->

<div class="footer">

<h3>
SCAN QR UNTUK VERIFIKASI DATA KAPAL
</h3>

<p>

SIMPAN V2 • DINAS PERIKANAN KABUPATEN BANGKA TENGAH

</p>

</div>

</div>

<script>

/* ====================================================== */
/* CSV URL V2 */
/* ====================================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584Q8mkVUkqHoS6wVp4iF/pub?output=csv&t=" +
new Date().getTime();

/* ====================================================== */
/* PARAM */
/* ====================================================== */

const params =
new URLSearchParams(
window.location.search
);

let id =
params.get("id") ||
"BT-SMP-0001";

/* ====================================================== */
/* DATE */
/* ====================================================== */

document.getElementById(
"tanggal"
).innerHTML =

new Date().toLocaleDateString(
"id-ID"
);

/* ====================================================== */
/* LOAD CSV */
/* ====================================================== */

Papa.parse(csvUrl,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(result){

const data = result.data;

console.log(data);

/* ====================================================== */
/* FIND DATA */
/* ====================================================== */

const kapal = data.find(item => {

const idKapal =

(
item["ID SIMPAN"] ||
item["Id SIMPAN"] ||
item["id simpan"] ||
""
)
.toString()
.trim()
.toUpperCase();

return idKapal === id.toUpperCase();

});

/* ====================================================== */
/* JIKA DATA DITEMUKAN */
/* ====================================================== */

if(kapal){

/* ID */

document.getElementById(
"idText"
).innerHTML =

kapal["ID SIMPAN"] ||
"-";

/* NAMA PEMILIK */

document.getElementById(
"namaPemilik"
).innerHTML =

kapal["NAMA PEMILIK KAPAL (SESUAI KTP)"] ||
kapal["Nama Pemilik Kapal (Sesuai KTP)"] ||
"-";

/* NAMA KAPAL */

document.getElementById(
"namaKapal"
).innerHTML =

kapal["NAMA KAPAL SESUAI PAS KAPAL"] ||
kapal["Nama Kapal"] ||
"-";

}

/* ====================================================== */
/* QR */
/* ====================================================== */

QRCode.toCanvas(

document.createElement("canvas"),

window.location.origin +
"/simpanv2/verifikasi-kapal.html?id=" +
id,

{
width:300
},

function(err,canvas){

if(err){

console.log(err);

return;

}

document
.getElementById("qrcode")
.innerHTML = "";

document
.getElementById("qrcode")
.appendChild(canvas);

}

);

}

});

/* ====================================================== */
/* SEARCH */
/* ====================================================== */

function cariQR(){

const input =
document.getElementById(
"searchInput"
)
.value
.trim();

if(!input){

alert(
"Masukkan 4 digit ID belakang"
);

return;

}

window.location.href =
"?id=BT-SMP-" + input;

}

/* ====================================================== */
/* ENTER */
/* ====================================================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

cariQR();

}

}
);

/* ====================================================== */
/* DOWNLOAD PNG */
/* ====================================================== */

function downloadPNG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".png";

link.href =
canvas.toDataURL();

link.click();

});

}

/* ====================================================== */
/* DOWNLOAD JPG */
/* ====================================================== */

function downloadJPG(){

html2canvas(
document.getElementById("card")
).then(canvas=>{

const link =
document.createElement("a");

link.download =
"QR-" + id + ".jpg";

link.href =
canvas.toDataURL(
"image/jpeg"
);

link.click();

});

}

</script>

</body>
</html>
