<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN</title>

<!-- QR CODE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- HTML2CANVAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:#dfe8f2;

    padding:20px;

}

/* ===================================
STIKER PRESISI 8 x 13 CM FINAL
=================================== */

.print-area{

    width:800px;
    height:1300px;

    margin:auto;

    background:#ffffff;

    border:5px solid #000;

    position:relative;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,0.20);

}

/* WATERMARK */
.print-area::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
    url('https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png');

    background-repeat:repeat;

    background-size:190px;

    opacity:0.022;

    z-index:1;

}

/* CONTENT */
.content{

    position:relative;

    z-index:2;

    padding:18px 28px 12px;

}

/* ===================================
HEADER
=================================== */

.header{

    text-align:center;

    margin-bottom:10px;

}

/* LOGO BATENG */
.logo{

    margin-bottom:8px;

}

.logo img{

    width:125px;

}

/* DINAS */
.dinas{

    font-size:31px;

    font-weight:900;

    line-height:1.08;

    color:#000;

    letter-spacing:0.2px;

}

/* ===================================
QR AREA
=================================== */

.qr-area{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    margin-bottom:6px;

}

/* QR BOX */
.qr-box{

    width:520px;

    height:520px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

}

/* QR */
#qrcode img{

    width:100% !important;

    height:100% !important;

}

/* ===================================
LOGO SIMPAN
=================================== */

.logo-mini{

    margin-top:8px;

    margin-bottom:4px;

    text-align:center;

}

.logo-mini img{

    width:145px;

}

/* ===================================
ID SIMPAN
=================================== */

.id{

    text-align:center;

    font-size:46px;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #003b9f,
        #0066ff
    );

    color:white;

    padding:10px 26px;

    border-radius:14px;

    display:table;

    margin:8px auto 10px;

    letter-spacing:1px;

    box-shadow:0 4px 12px rgba(0,60,160,0.22);

}

/* ===================================
INFO
=================================== */

.info{

    text-align:center;

    font-size:22px;

    line-height:1.42;

    margin-bottom:12px;

    color:#111;

    font-weight:600;

}

/* ===================================
SCAN
=================================== */

.scan{

    text-align:center;

    font-size:28px;

    font-weight:900;

    margin-bottom:6px;

    color:#000;

}

/* ===================================
DATE
=================================== */

.date{

    text-align:center;

    font-size:18px;

    color:#222;

}

/* ===================================
FOOTER
=================================== */

.footer{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:5px;

    background:#000;

}

/* ===================================
BUTTON
=================================== */

.button-area{

    width:800px;

    margin:18px auto;

    display:flex;

    gap:14px;

}

.btn{

    flex:1;

    padding:16px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #003b8f,
        #0099ff
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.25s;

    box-shadow:0 5px 14px rgba(0,80,180,0.24);

}

.btn:hover{

    transform:translateY(-2px);

}

/* ===================================
RESPONSIVE
=================================== */

@media(max-width:850px){

    body{

        padding:10px;

    }

    .print-area{

        width:100%;

        height:auto;

    }

    .button-area{

        width:100%;

        flex-direction:column;

    }

    .qr-box{

        width:100%;

        height:auto;

    }

    #qrcode img{

        width:100% !important;

        height:auto !important;

    }

}

/* ===================================
PRINT
=================================== */

@media print{

    body{

        background:white;

        padding:0;

    }

    .button-area{

        display:none;

    }

    .print-area{

        width:8cm;

        height:13cm;

        border:5px solid #000;

        box-shadow:none;

    }

}

</style>

</head>

<body>

<!-- ===================================
AREA CETAK
=================================== -->

<div class="print-area" id="printArea">

    <div class="content">

        <!-- HEADER -->
        <div class="header">

            <!-- LOGO BATENG -->
            <div class="logo">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-bateng.png">

            </div>

            <!-- DINAS -->
            <div class="dinas">

                DINAS PERIKANAN<br>
                KABUPATEN BANGKA TENGAH

            </div>

        </div>

        <!-- QR AREA -->
        <div class="qr-area">

            <!-- QR -->
            <div class="qr-box">

                <div id="qrcode"></div>

            </div>

            <!-- LOGO SIMPAN -->
            <div class="logo-mini">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png">

            </div>

        </div>

        <!-- ID -->
        <div class="id" id="idSimpan">

            MEMUAT...

        </div>

        <!-- INFO -->
        <div class="info">

            <div id="namaNelayan"></div>

            <div id="namaKapal"></div>

        </div>

        <!-- SCAN -->
        <div class="scan">

            📱 SCAN UNTUK VERIFIKASI

        </div>

        <!-- DATE -->
        <div class="date" id="tanggalCetak"></div>

    </div>

    <!-- FOOTER -->
    <div class="footer"></div>

</div>

<!-- ===================================
BUTTON
=================================== -->

<div class="button-area">

    <button class="btn" onclick="window.print()">

        🖨 CETAK QR

    </button>

    <button class="btn" onclick="downloadQR()">

        📥 DOWNLOAD PNG

    </button>

</div>

<script>

/* ===================================
CSV GOOGLE SHEET
=================================== */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

/* ===================================
AMBIL PARAMETER URL
=================================== */

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

/* ===================================
TANGGAL CETAK
=================================== */

const now = new Date();

document.getElementById("tanggalCetak").innerHTML =
"Tanggal Cetak : " +
now.toLocaleDateString("id-ID");

/* ===================================
LOAD DATA
=================================== */

Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            /* LINK QR */
            const qrLink =
            "https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
            kapal["ID SIMPAN"];

            /* GENERATE QR */
            new QRCode(document.getElementById("qrcode"), {

                text:qrLink,

                width:500,

                height:500,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:QRCode.CorrectLevel.H

            });

            /* ID */
            document.getElementById("idSimpan").innerHTML =
            kapal["ID SIMPAN"];

            /* NAMA */
            document.getElementById("namaNelayan").innerHTML =
            "NAMA : " +
            (kapal["NAMA PEMILIK KAPAL (SESUAI KTP)"] || "-");

            /* KAPAL */
            document.getElementById("namaKapal").innerHTML =
            "KAPAL : " +
            (kapal["NAMA KAPAL SESUAI PAS KAPAL"] || "-");

        }else{

            document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:100px;
                font-size:40px;
                font-weight:bold;
                color:red;
            ">

                DATA TIDAK DITEMUKAN

            </div>

            `;

        }

    }

});

/* ===================================
DOWNLOAD PNG
=================================== */

function downloadQR(){

    html2canvas(document.querySelector("#printArea"),{

        scale:4

    }).then(canvas => {

        const link = document.createElement("a");

        link.download = kapalId + ".png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
