<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:#dfe8f2;

    padding:20px;

}

/* ===========================
SEARCH
=========================== */

.search-box{

    width:1000px;

    margin:auto auto 18px;

    display:flex;

    gap:16px;

}

.search-box input{

    flex:1;

    height:88px;

    border:3px solid #0b63ff;

    border-radius:24px;

    padding:0 30px;

    font-size:34px;

    outline:none;

}

.search-box button{

    width:280px;

    border:none;

    border-radius:24px;

    background:linear-gradient(
        135deg,
        #0042b5,
        #008cff
    );

    color:white;

    font-size:34px;

    font-weight:900;

    cursor:pointer;

    box-shadow:0 10px 20px rgba(0,0,0,0.16);

}

/* ===========================
STIKER
=========================== */

.print-area{

    width:900px;

    min-height:1400px;

    margin:auto;

    background:#fff;

    border:6px solid #000;

    position:relative;

    overflow:hidden;

    box-shadow:0 12px 30px rgba(0,0,0,0.22);

}

/* WATERMARK */

.print-area::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:url('logo-simpan.png');

    background-repeat:repeat;

    background-size:180px;

    opacity:0.03;

}

/* CONTENT */

.content{

    position:relative;

    z-index:2;

    padding:26px 40px 24px;

}

/* HEADER */

.header{

    text-align:center;

}

.logo img{

    width:120px;

}

.dinas{

    margin-top:10px;

    font-size:32px;

    line-height:1.08;

    font-weight:900;

    color:#000;

}

/* QR */

.qr-area{

    margin-top:14px;

    text-align:center;

}

.qr-box{

    width:620px;

    height:620px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

}

#qrcode img{

    width:100% !important;

    height:100% !important;

}

/* LOGO SIMPAN */

.logo-mini{

    margin-top:-12px;

    margin-bottom:8px;

}

.logo-mini img{

    width:170px;

}

/* ID */

.id{

    text-align:center;

    width:fit-content;

    margin:0 auto 18px;

    background:linear-gradient(
        135deg,
        #0042b5,
        #007cff
    );

    color:white;

    padding:12px 38px;

    border-radius:18px;

    font-size:58px;

    font-weight:900;

    letter-spacing:1px;

    box-shadow:0 6px 16px rgba(0,0,0,0.15);

}

/* INFO */

.info{

    width:92%;

    margin:auto;

    border-top:4px dotted #111;

    border-bottom:4px dotted #111;

    padding:16px 0;

}

/* ROW */

.info-row{

    display:flex;

    align-items:flex-start;

    gap:16px;

    margin:12px 0;

}

/* ICON */

.icon{

    width:44px;

    text-align:center;

    font-size:32px;

    margin-top:2px;

}

/* LABEL */

.label{

    width:260px;

    min-width:260px;

    font-size:28px;

    font-weight:900;

    line-height:1.25;

}

/* VALUE */

.value{

    flex:1;

    font-weight:900;

    line-height:1.25;

    word-break:break-word;

    overflow-wrap:break-word;

    hyphens:auto;

}

/* AUTO TEXT */

.auto-text{

    font-size:28px;

}

/* LONG */

.auto-text.long{

    font-size:24px;

}

/* VERY LONG */

.auto-text.very-long{

    font-size:21px;

}

/* SCAN */

.scan{

    text-align:center;

    margin-top:20px;

    font-size:34px;

    font-weight:900;

}

/* DATE */

.date{

    text-align:center;

    margin-top:10px;

    font-size:24px;

}

/* BUTTON */

.button-area{

    width:900px;

    margin:18px auto;

    display:flex;

    gap:18px;

}

.btn{

    flex:1;

    height:72px;

    border:none;

    border-radius:18px;

    background:linear-gradient(
        135deg,
        #0042b5,
        #008cff
    );

    color:white;

    font-size:30px;

    font-weight:900;

    cursor:pointer;

}

/* PRINT */

@media print{

    body{

        background:white;

        padding:0;

    }

    .search-box,
    .button-area{

        display:none;

    }

    .print-area{

        width:8cm;

        height:13cm;

        box-shadow:none;

        margin:0;

    }

}

</style>

</head>
<body>

<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Masukkan 4 digit ID belakang..."
        maxlength="4"
    >

    <button onclick="cariQR()">

        🔍 CARI QR

    </button>

</div>

<!-- STIKER -->

<div class="print-area" id="printArea">

    <div class="content">

        <!-- HEADER -->

        <div class="header">

            <div class="logo">

                <img src="logo-bateng.png">

            </div>

            <div class="dinas">

                DINAS PERIKANAN<br>
                KABUPATEN BANGKA TENGAH

            </div>

        </div>

        <!-- QR -->

        <div class="qr-area">

            <div class="qr-box">

                <div id="qrcode"></div>

            </div>

            <div class="logo-mini">

                <img src="logo-simpan.png">

            </div>

        </div>

        <!-- ID -->

        <div class="id" id="idSimpan">

            MEMUAT...

        </div>

        <!-- INFO -->

        <div class="info">

            <!-- NAMA PEMILIK -->

            <div class="info-row">

                <div class="icon">

                    👤

                </div>

                <div class="label">

                    NAMA PEMILIK

                </div>

                <div class="value auto-text" id="namaNelayan">

                    -

                </div>

            </div>

            <!-- NAMA KAPAL -->

            <div class="info-row">

                <div class="icon">

                    🚢

                </div>

                <div class="label">

                    NAMA KAPAL

                </div>

                <div class="value auto-text" id="namaKapal">

                    -

                </div>

            </div>

        </div>

        <!-- SCAN -->

        <div class="scan">

            📱 SCAN UNTUK VERIFIKASI

        </div>

        <!-- DATE -->

        <div class="date" id="tanggalCetak"></div>

    </div>

</div>

<!-- BUTTON -->

<div class="button-area">

    <button class="btn" onclick="window.print()">

        🖨 CETAK QR

    </button>

    <button class="btn" onclick="downloadQR()">

        ⬇ DOWNLOAD PNG

    </button>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

const now = new Date();

document.getElementById("tanggalCetak").innerHTML =
"Tanggal Cetak : " +
now.toLocaleDateString("id-ID");

/* AUTO RESIZE TEXT */

function autoResizeText(element){

    const length = element.innerText.length;

    element.classList.remove(
        "long",
        "very-long"
    );

    if(length > 45){

        element.classList.add(
            "very-long"
        );

    }
    else if(length > 28){

        element.classList.add(
            "long"
        );

    }

}

/* LOAD DATA */

Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            const qrLink =
            "https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
            kapal["ID SIMPAN"];

            new QRCode(document.getElementById("qrcode"), {

                text:qrLink,

                width:600,

                height:600,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:QRCode.CorrectLevel.H

            });

            document.getElementById("idSimpan").innerHTML =
            kapal["ID SIMPAN"];

            document.getElementById("namaNelayan").innerHTML =
            ": " +
            (
                kapal[
                "NAMA PEMILIK KAPAL (SESUAI KTP)"
                ] || "-"
            );

            document.getElementById("namaKapal").innerHTML =
            ": " +
            (
                kapal[
                "NAMA KAPAL SESUAI PAS KAPAL"
                ] || "-"
            );

            /* AUTO TEXT */

            autoResizeText(
                document.getElementById(
                    "namaNelayan"
                )
            );

            autoResizeText(
                document.getElementById(
                    "namaKapal"
                )
            );

        }

    }

});

/* SEARCH */

function cariQR(){

    const input =
    document.getElementById("searchInput")
    .value
    .trim();

    if(input.length < 1){

        alert("Masukkan nomor ID");

        return;

    }

    Papa.parse(csvUrl, {

        download:true,

        header:true,

        skipEmptyLines:true,

        complete:function(results){

            const data = results.data;

            const kapal = data.find(item => {

                const id = item["ID SIMPAN"] || "";

                return id.endsWith(input);

            });

            if(kapal){

                window.location.href =
                "qr.html?id=" +
                kapal["ID SIMPAN"];

            }else{

                alert("Data tidak ditemukan");

            }

        }

    });

}

/* ENTER */

document
.getElementById("searchInput")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        cariQR();

    }

});

/* DOWNLOAD PNG */

function downloadQR(){

    html2canvas(document.querySelector("#printArea"),{

        scale:4

    }).then(canvas => {

        const link =
        document.createElement("a");

        link.download =
        kapalId + ".png";

        link.href =
        canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
