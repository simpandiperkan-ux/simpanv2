<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN</title>

<!-- QRCode -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:#dbe7f2;

    padding:20px;

}

/* ===============================
STIKER 8 x 13 cm PRESISI
================================= */

.print-area{

    width:800px;

    height:1300px;

    margin:auto;

    background:#ffffff;

    border:2px solid #000;

    position:relative;

    overflow:hidden;

    box-shadow:0 8px 20px rgba(0,0,0,0.18);

}

/* WATERMARK */
.print-area::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
    url('https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png');

    background-repeat:repeat;

    background-size:190px;

    opacity:0.018;

    z-index:1;

}

/* CONTENT */
.content{

    position:relative;

    z-index:2;

    padding:18px 24px 12px;

}

/* ===============================
HEADER
================================= */

.header{

    text-align:center;

    border-bottom:3px solid #0056b3;

    padding-bottom:14px;

    margin-bottom:14px;

}

/* LOGO */
.logo{

    margin-bottom:10px;

}

.logo img{

    width:130px;

}

/* DINAS */
.dinas{

    font-size:31px;

    line-height:1.15;

    font-weight:900;

    color:#000;

    letter-spacing:0.4px;

}

/* ===============================
QR AREA
================================= */

.qr-area{

    border-top:1px solid #d9d9d9;

    border-bottom:1px solid #d9d9d9;

    padding:18px 0;

    margin-bottom:12px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}

/* QR BOX */
.qr-box{

    width:560px;

    height:560px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

}

/* QR */
#qrcode img{

    width:100% !important;

    height:100% !important;

}

/* LOGO MINI */
.logo-mini{

    margin-top:12px;

}

.logo-mini img{

    width:70px;

    opacity:0.9;

}

/* ===============================
ID SIMPAN
================================= */

.id{

    text-align:center;

    font-size:42px;

    font-weight:900;

    background:#003b8f;

    color:white;

    padding:10px 24px;

    border-radius:14px;

    display:table;

    margin:14px auto;

    letter-spacing:1px;

    box-shadow:0 4px 12px rgba(0,59,143,0.2);

}

/* ===============================
INFO
================================= */

.info{

    text-align:center;

    font-size:24px;

    line-height:1.35;

    margin-bottom:18px;

    color:#111;

}

/* ===============================
SCAN
================================= */

.scan{

    text-align:center;

    font-size:30px;

    font-weight:900;

    margin-bottom:10px;

}

/* ===============================
DATE
================================= */

.date{

    text-align:center;

    font-size:18px;

    color:#333;

}

/* ===============================
FOOTER
================================= */

.footer{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:3px;

    background:#000;

}

/* ===============================
BUTTON
================================= */

.button-area{

    width:800px;

    margin:18px auto;

    display:flex;

    gap:14px;

}

.btn{

    flex:1;

    padding:16px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #003b8f,
        #0099ff
    );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:0.25s;

    box-shadow:0 4px 12px rgba(0,80,180,0.22);

}

.btn:hover{

    transform:translateY(-2px);

}

/* ===============================
RESPONSIVE
================================= */

@media(max-width:850px){

    body{

        padding:10px;

    }

    .print-area{

        width:100%;

        height:auto;

    }

    .button-area{

        width:100%;

        flex-direction:column;

    }

    .qr-box{

        width:100%;

        height:auto;

    }

    #qrcode img{

        width:100% !important;

        height:auto !important;

    }

}

/* ===============================
PRINT
================================= */

@media print{

    body{

        background:white;

        padding:0;

    }

    .button-area{

        display:none;

    }

    .print-area{

        width:8cm;

        height:13cm;

        border:2px solid #000;

        box-shadow:none;

    }

}

</style>

</head>

<body>

<!-- ===============================
AREA CETAK
================================= -->

<div class="print-area" id="printArea">

    <div class="content">

        <!-- HEADER -->
        <div class="header">

            <!-- LOGO -->
            <div class="logo">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-bateng.png">

            </div>

            <!-- DINAS -->
            <div class="dinas">

                DINAS PERIKANAN<br>
                KABUPATEN BANGKA TENGAH

            </div>

        </div>

        <!-- QR AREA -->
        <div class="qr-area">

            <!-- QR -->
            <div class="qr-box">

                <div id="qrcode"></div>

            </div>

            <!-- LOGO MINI -->
            <div class="logo-mini">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png">

            </div>

        </div>

        <!-- ID -->
        <div class="id" id="idSimpan">

            MEMUAT...

        </div>

        <!-- INFO -->
        <div class="info">

            <div id="namaNelayan"></div>

            <div id="namaKapal"></div>

        </div>

        <!-- SCAN -->
        <div class="scan">

            📱 SCAN UNTUK VERIFIKASI

        </div>

        <!-- DATE -->
        <div class="date" id="tanggalCetak"></div>

    </div>

    <!-- FOOTER -->
    <div class="footer"></div>

</div>

<!-- ===============================
BUTTON
================================= -->

<div class="button-area">

    <button class="btn" onclick="window.print()">

        🖨 CETAK QR

    </button>

    <button class="btn" onclick="downloadQR()">

        📥 DOWNLOAD PNG

    </button>

</div>

<script>

/* ===============================
CSV GOOGLE SHEET
================================= */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

/* ===============================
AMBIL PARAMETER URL
================================= */

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

/* ===============================
TANGGAL CETAK
================================= */

const now = new Date();

document.getElementById("tanggalCetak").innerHTML =
"Tanggal Cetak : " +
now.toLocaleDateString("id-ID");

/* ===============================
LOAD CSV
================================= */

Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            /* LINK VERIFIKASI */
            const qrLink =
            "https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
            kapal["ID SIMPAN"];

            /* GENERATE QR */
            new QRCode(document.getElementById("qrcode"), {

                text:qrLink,

                width:540,

                height:540,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:QRCode.CorrectLevel.H

            });

            /* ID */
            document.getElementById("idSimpan").innerHTML =
            kapal["ID SIMPAN"];

            /* NAMA */
            document.getElementById("namaNelayan").innerHTML =
            "NAMA : " +
            (kapal["NAMA PEMILIK KAPAL (SESUAI KTP)"] || "-");

            /* KAPAL */
            document.getElementById("namaKapal").innerHTML =
            "KAPAL : " +
            (kapal["NAMA KAPAL SESUAI PAS KAPAL"] || "-");

        }else{

            document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:100px;
                font-size:40px;
                font-weight:bold;
                color:red;
            ">

                DATA TIDAK DITEMUKAN

            </div>

            `;

        }

    }

});

/* ===============================
DOWNLOAD PNG
================================= */

function downloadQR(){

    html2canvas(document.querySelector("#printArea"),{

        scale:4

    }).then(canvas => {

        const link = document.createElement("a");

        link.download = kapalId + ".png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
