<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>CETAK QR SAMPAN SUPER APP</title>

<!-- ====================================================== -->
<!-- FONT -->
<!-- ====================================================== -->

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<!-- ====================================================== -->
<!-- QR -->
<!-- ====================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- ====================================================== -->
<!-- CSV -->
<!-- ====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- ====================================================== -->
<!-- EXPORT -->
<!-- ====================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* ====================================================== */
/* RESET */
/* ====================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ====================================================== */
/* BODY */
/* ====================================================== */

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#dfe8f6,
#cad7ea
);

min-height:100vh;

padding:30px;

display:flex;

flex-direction:column;

align-items:center;

overflow-x:auto;

}

/* ====================================================== */
/* SEARCH */
/* ====================================================== */

.search-box{

display:flex;

gap:16px;

width:100%;
max-width:860px;

margin-bottom:20px;

}

.search-box input{

flex:1;

height:68px;

border:none;

outline:none;

padding:0 26px;

font-size:20px;

font-weight:700;

border-radius:18px;

background:white;

box-shadow:
0 10px 24px rgba(0,0,0,.10);

}

.search-box button{

width:220px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#0066ff,
#00a6ff
);

color:white;

font-size:20px;

font-weight:900;

cursor:pointer;

box-shadow:
0 10px 24px rgba(0,0,0,.16);

}

/* ====================================================== */
/* BUTTON */
/* ====================================================== */

.actions{

display:flex;

gap:12px;

margin-bottom:20px;

flex-wrap:wrap;

justify-content:center;

}

.actions button{

padding:12px 22px;

border:none;

border-radius:12px;

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

color:white;

font-size:14px;

font-weight:800;

cursor:pointer;

}

/* ====================================================== */
/* PILIHAN DATA */
/* ====================================================== */

#pilihanData{

width:100%;
max-width:1011px;

margin-bottom:20px;

display:none;

gap:12px;

flex-direction:column;

}

.pilih-item{

background:white;

padding:18px 22px;

border-radius:18px;

cursor:pointer;

border:2px solid rgba(0,94,255,.12);

box-shadow:
0 10px 24px rgba(0,0,0,.08);

transition:.3s;

}

.pilih-item:hover{

transform:translateY(-2px);

border-color:#005eff;

}

.badge{

display:inline-block;

padding:5px 12px;

border-radius:999px;

font-size:12px;

font-weight:800;

margin-bottom:8px;

color:white;

}

.badge.v1{

background:#666;

}

.badge.v2{

background:#005eff;

}

.pilih-item h3{

font-size:20px;

font-weight:800;

color:#0047b3;

margin-bottom:6px;

}

.pilih-item p{

font-size:14px;

color:#444;

}

/* ====================================================== */
/* CARD */
/* ====================================================== */

.card{

width:1011px;
height:638px;

background:white;

border-radius:30px;

padding:26px;

position:relative;

overflow:hidden;

border:
5px solid #005eff;

box-shadow:
0 24px 60px rgba(0,0,0,.18);

display:flex;

flex-direction:column;

justify-content:space-between;

}

/* WATERMARK */

.card::before{

content:"";

position:absolute;

inset:0;

background-image:url('logo-sampan.png');

background-repeat:repeat;

background-size:150px;

opacity:.03;

}

/* ====================================================== */
/* HEADER */
/* ====================================================== */

.header{

display:grid;

grid-template-columns:
110px 1fr 110px;

align-items:center;

column-gap:16px;

padding-bottom:16px;

border-bottom:
2px solid rgba(0,94,255,.12);

position:relative;
z-index:2;

}

.logo-bateng{

width:88px;

display:block;

margin:auto;

margin-top:8px;

}

.logo-sampan{

width:105px;

display:block;

margin:auto;

}

.header-text{

text-align:center;

}

.header-text h1{

font-size:42px;

font-weight:900;

line-height:1.05;

color:#0047b3;

margin-bottom:10px;

}

.header-text p{

font-size:15px;

font-weight:500;

color:#333;

}

/* ====================================================== */
/* MAIN */
/* ====================================================== */

.main{

display:grid;

grid-template-columns:
390px 1fr;

gap:22px;

align-items:center;

margin-top:16px;

position:relative;
z-index:2;

}

/* QR */

.qr-box{

height:330px;

border:
4px solid #005eff;

border-radius:22px;

display:flex;

justify-content:center;

align-items:center;

padding:12px;

background:white;

}

/* RIGHT */

.right{

display:flex;

flex-direction:column;

gap:16px;

height:330px;

}

.id-box{

height:72px;

border-radius:18px;

background:
linear-gradient(
135deg,
#005eff,
#0044cc
);

display:flex;

justify-content:center;

align-items:center;

}

.id-box h2{

font-size:38px;

font-weight:900;

color:white;

}

.detail-box{

flex:1;

border:
2px solid rgba(0,94,255,.10);

border-radius:20px;

padding:20px;

background:
rgba(0,94,255,.03);

}

.detail-item{

padding:10px 0;

border-bottom:
1px solid rgba(0,94,255,.10);

}

.detail-item:last-child{

border-bottom:none;

}

.detail-item h3{

font-size:13px;

font-weight:500;

color:#555;

margin-bottom:5px;

}

.detail-item p{

font-size:24px;

font-weight:800;

color:#0047b3;

line-height:1.3;

}

/* ====================================================== */
/* FOOTER */
/* ====================================================== */

.footer{

margin-top:12px;

padding-top:12px;

border-top:
2px solid rgba(0,94,255,.12);

text-align:center;

}

.footer h3{

font-size:24px;

font-weight:900;

color:#005eff;

margin-bottom:6px;

}

.footer p{

font-size:13px;

font-weight:600;

color:#333;

}

</style>

</head>

<body>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan 4 digit ID belakang..."
maxlength="4"
>

<button onclick="cariQR()">

🔍 CARI QR

</button>

</div>

<!-- PILIHAN -->

<div id="pilihanData"></div>

<!-- BUTTON -->

<div class="actions">

<button onclick="downloadPNG()">
🖼 Download PNG
</button>

<button onclick="downloadJPG()">
🖼 Download JPG
</button>

<button onclick="window.print()">
📄 Download PDF
</button>

</div>

<!-- CARD -->

<div class="card" id="card">

<!-- HEADER -->

<div class="header">

<div>

<img
src="logo-bateng.png"
class="logo-bateng"
>

</div>

<div class="header-text">

<h1>

DINAS PERIKANAN
<br>
KABUPATEN BANGKA TENGAH

</h1>

<p>

Sistem Administrasi Manajemen Pendataan Armada Nelayan

</p>

</div>

<div>

<img
src="logo-sampan.png"
class="logo-sampan"
>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- QR -->

<div class="qr-box">

<div id="qrcode"></div>

</div>

<!-- RIGHT -->

<div class="right">

<div class="id-box">

<h2 id="idText">

MEMUAT...

</h2>

</div>

<div class="detail-box">

<div class="detail-item">

<h3>
👤 Pemilik :
</h3>

<p id="namaPemilik">
-
</p>

</div>

<div class="detail-item">

<h3>
🚢 Nama Kapal :
</h3>

<p id="namaKapal">
-
</p>

</div>

<div class="detail-item">

<h3>
📅 Tanggal Cetak :
</h3>

<p id="tanggal">
-
</p>

</div>

</div>

</div>

</div>

<!-- FOOTER -->

<div class="footer">

<h3>

SCAN QR UNTUK VERIFIKASI DATA KAPAL

</h3>

<p id="footerText">

SAMPAN SUPER APP • DINAS PERIKANAN KABUPATEN BANGKA TENGAH

</p>

</div>

</div>

<script>

/* ====================================================== */
/* CSV */
/* ====================================================== */

const csvV1 =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSBI5O8DJD_-VoI2Bf3NDHY_x1eFO8vQgrmpw7L1VW_HczX9avlE5HVX2yN16nRQ8gq_UD0xp_wWfvk/pub?output=csv";

const csvV2 =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

/* ====================================================== */
/* GLOBAL */
/* ====================================================== */

let semuaData = [];
let dataAktif = null;

const params =
new URLSearchParams(window.location.search);

const kapalId =
params.get("id");

/* DATE */

document.getElementById("tanggal").innerHTML =
new Date().toLocaleDateString("id-ID");

/* ====================================================== */
/* LOAD V1 */
/* ====================================================== */

Papa.parse(csvV1,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(v1){

const dataV1 = v1.data.map(item => ({

id:item["ID SIMPAN"] || "",

pemilik:
item["Nama Pemilik Kapal (Sesuai KTP)"] || "-",

kapal:
item["Nama Kapal"] || "-",

source:"V1",

url:
"https://simpandiperkan-ux.github.io/simpanv2/v1/kapal.html?id=" +
(item["ID SIMPAN"] || "")

}));

/* ====================================================== */
/* LOAD V2 */
/* ====================================================== */

Papa.parse(csvV2,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(v2){

const dataV2 = v2.data.map(item => ({

id:item["ID SIMPAN"] || "",

pemilik:
item["NAMA PEMILIK KAPAL (SESUAI KTP)"] || "-",

kapal:
item["NAMA KAPAL SESUAI PAS KAPAL"] || "-",

source:"V2",

url:
"https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
(item["ID SIMPAN"] || "")

}));

semuaData = [
...dataV1,
...dataV2
];

/* AUTO LOAD */

if(kapalId){

const hasil =
semuaData.filter(item =>

item.id.trim() === kapalId.trim()

);

if(hasil.length > 0){

loadCard(hasil[0]);

}

}

}

});

}

});

/* ====================================================== */
/* LOAD CARD */
/* ====================================================== */

function loadCard(data){

dataAktif = data;

/* ID */

document.getElementById("idText").innerHTML =
data.id;

/* NAMA */

document.getElementById("namaPemilik").innerHTML =
data.pemilik;

document.getElementById("namaKapal").innerHTML =
data.kapal;

/* FOOTER */

document.getElementById("footerText").innerHTML =
"SAMPAN " +
data.source +
" • DINAS PERIKANAN KABUPATEN BANGKA TENGAH";

/* QR */

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{

text:data.url,

width:300,
height:300,

colorDark:"#000000",
colorLight:"#ffffff",

correctLevel:QRCode.CorrectLevel.H

});

}

/* ====================================================== */
/* SEARCH */
/* ====================================================== */

function cariQR(){

const input =
document.getElementById("searchInput")
.value
.trim();

if(!input){

alert("Masukkan ID");

return;

}

const hasil =
semuaData.filter(item => {

const id = item.id || "";

return id.endsWith(input);

});

/* TIDAK ADA */

if(hasil.length === 0){

alert("Data tidak ditemukan");

return;

}

/* 1 DATA */

if(hasil.length === 1){

loadCard(hasil[0]);

return;

}

/* LEBIH DARI 1 */

const pilihan =
document.getElementById("pilihanData");

pilihan.style.display = "flex";

pilihan.innerHTML = "";

hasil.forEach(item => {

const div =
document.createElement("div");

div.className = "pilih-item";

div.innerHTML =

`
<div class="badge ${item.source.toLowerCase()}">
SIMPAN ${item.source}
</div>

<h3>
${item.kapal}
</h3>

<p>
${item.pemilik}
</p>
`;

div.onclick = () => {

loadCard(item);

pilihan.style.display = "none";

};

pilihan.appendChild(div);

});

}

/* ENTER */

document
.getElementById("searchInput")
.addEventListener("keypress", function(e){

if(e.key === "Enter"){

cariQR();

}

});

/* ====================================================== */
/* NAMA FILE DOWNLOAD */
/* ====================================================== */

function buatNamaFile(){

    if(!dataAktif){
        return "QR-SAMPAN";
    }

    const idSimpan =
    (dataAktif.id || "")
    .trim();

    const pemilik =
    (dataAktif.pemilik || "")
    .trim()
    .replace(/[\\/:*?"<>|]/g,'');

    const kapal =
    (dataAktif.kapal || "")
    .trim()
    .replace(/[\\/:*?"<>|]/g,'');

    return `${idSimpan}-${pemilik}-${kapal}`;

}

/* ====================================================== */
/* DOWNLOAD PNG */
/* ====================================================== */

function downloadPNG(){

    html2canvas(document.querySelector("#card"),{
        scale:4
    }).then(canvas => {

        const link =
        document.createElement("a");

        link.download =
        buatNamaFile() + ".png";

        link.href =
        canvas.toDataURL("image/png");

        link.click();

    });

}

/* ====================================================== */
/* DOWNLOAD JPG */
/* ====================================================== */

function downloadJPG(){

    html2canvas(document.querySelector("#card"),{
        scale:4
    }).then(canvas => {

        const link =
        document.createElement("a");

        link.download =
        buatNamaFile() + ".jpg";

        link.href =
        canvas.toDataURL("image/jpeg");

        link.click();

    });

}

</script>

</body>
</html>
