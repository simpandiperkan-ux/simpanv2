<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN</title>

<!-- QR CODE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- HTML2CANVAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:#dfeaf5;

    padding:20px;

}

/* =========================
UKURAN STIKER 8 x 13 cm
========================= */

.print-area{

    width:800px;

    height:1300px;

    margin:auto;

    background:#ffffff;

    border:3px solid #000;

    position:relative;

    overflow:hidden;

    box-shadow:0 8px 25px rgba(0,0,0,0.18);

}

/* WATERMARK */
.print-area::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
    url('https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png');

    background-repeat:repeat;

    background-size:200px;

    opacity:0.02;

    z-index:1;

}

/* CONTENT */
.content{

    position:relative;

    z-index:2;

    padding:20px 25px 15px;

}

/* HEADER */
.header{

    text-align:center;

    border-bottom:4px solid #0056b3;

    padding-bottom:20px;

    margin-bottom:20px;

}

/* LOGO */
.logo{

    margin-bottom:12px;

}

.logo img{

    width:165px;

}

/* DINAS */
.dinas{

    text-align:center;

    font-size:40px;

    font-weight:900;

    line-height:1.15;

    letter-spacing:0.5px;

    color:#000;

}

/* QR AREA */
.qr-area{

    border-top:2px solid #d9d9d9;

    border-bottom:2px solid #d9d9d9;

    padding:25px 0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    margin-bottom:20px;

}

/* QR BOX */
.qr-box{

    width:640px;

    height:640px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

}

/* QR */
#qrcode img{

    width:100% !important;

    height:100% !important;

}

/* LOGO MINI */
.logo-mini{

    text-align:center;

    margin-top:18px;

}

.logo-mini img{

    width:90px;

    opacity:0.92;

}

/* ID */
.id{

    text-align:center;

    font-size:52px;

    font-weight:900;

    margin:20px auto;

    letter-spacing:1px;

    background:#003b8f;

    color:white;

    padding:12px 28px;

    border-radius:18px;

    display:table;

    box-shadow:0 5px 15px rgba(0,59,143,0.25);

}

/* INFO */
.info{

    text-align:center;

    font-size:30px;

    line-height:1.4;

    margin-bottom:28px;

    color:#111;

}

/* SCAN */
.scan{

    text-align:center;

    font-size:38px;

    font-weight:900;

    margin-bottom:18px;

    letter-spacing:0.5px;

    color:#000;

}

/* DATE */
.date{

    text-align:center;

    font-size:22px;

    color:#333;

}

/* FOOTER */
.footer{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:4px;

    background:#000;

}

/* BUTTON AREA */
.button-area{

    width:800px;

    margin:20px auto;

    display:flex;

    gap:15px;

}

/* BUTTON */
.btn{

    flex:1;

    padding:18px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #003b8f,
        #0099ff
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:0 5px 15px rgba(0,80,180,0.25);

}

.btn:hover{

    transform:translateY(-2px);

}

/* RESPONSIVE */
@media(max-width:850px){

    body{

        padding:10px;

    }

    .print-area{

        width:100%;

        height:auto;

    }

    .button-area{

        width:100%;

        flex-direction:column;

    }

    .dinas{

        font-size:26px;

    }

    .id{

        font-size:36px;

    }

    .info{

        font-size:22px;

    }

    .scan{

        font-size:28px;

    }

    .qr-box{

        width:100%;

        height:auto;

    }

    #qrcode img{

        width:100% !important;

        height:auto !important;

    }

}

/* PRINT */
@media print{

    body{

        background:white;

        padding:0;

    }

    .button-area{

        display:none;

    }

    .print-area{

        width:8cm;

        height:13cm;

        border:2px solid #000;

        box-shadow:none;

    }

}

</style>

</head>

<body>

<!-- AREA CETAK -->
<div class="print-area" id="printArea">

    <div class="content">

        <!-- HEADER -->
        <div class="header">

            <!-- LOGO -->
            <div class="logo">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-bateng.png">

            </div>

            <!-- DINAS -->
            <div class="dinas">

                DINAS PERIKANAN<br>
                KABUPATEN BANGKA TENGAH

            </div>

        </div>

        <!-- QR AREA -->
        <div class="qr-area">

            <!-- QR -->
            <div class="qr-box">

                <div id="qrcode"></div>

            </div>

            <!-- LOGO MINI -->
            <div class="logo-mini">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png">

            </div>

        </div>

        <!-- ID -->
        <div class="id" id="idSimpan">

            MEMUAT...

        </div>

        <!-- INFO -->
        <div class="info">

            <div id="namaNelayan"></div>

            <div id="namaKapal"></div>

        </div>

        <!-- SCAN -->
        <div class="scan">

            📱 SCAN UNTUK VERIFIKASI

        </div>

        <!-- DATE -->
        <div class="date" id="tanggalCetak"></div>

    </div>

    <!-- FOOTER -->
    <div class="footer"></div>

</div>

<!-- BUTTON -->
<div class="button-area">

    <button class="btn" onclick="window.print()">

        🖨 CETAK QR

    </button>

    <button class="btn" onclick="downloadQR()">

        📥 DOWNLOAD PNG

    </button>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

/* TANGGAL */
const now = new Date();

document.getElementById("tanggalCetak").innerHTML =
"Tanggal Cetak : " +
now.toLocaleDateString("id-ID");

/* LOAD DATA */
Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            /* LINK QR */
            const qrLink =
            "https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
            kapal["ID SIMPAN"];

            /* GENERATE QR */
            new QRCode(document.getElementById("qrcode"), {

                text:qrLink,

                width:620,

                height:620,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:QRCode.CorrectLevel.H

            });

            /* DATA */
            document.getElementById("idSimpan").innerHTML =
            kapal["ID SIMPAN"];

            document.getElementById("namaNelayan").innerHTML =
            "NAMA : " +
            (kapal["NAMA PEMILIK KAPAL (SESUAI KTP)"] || "-");

            document.getElementById("namaKapal").innerHTML =
            "KAPAL : " +
            (kapal["NAMA KAPAL SESUAI PAS KAPAL"] || "-");

        }else{

            document.body.innerHTML = `

                <div style="
                    text-align:center;
                    padding:100px;
                    font-size:40px;
                    font-weight:bold;
                    color:red;
                ">

                    DATA TIDAK DITEMUKAN

                </div>

            `;

        }

    }

});

/* DOWNLOAD PNG */
function downloadQR(){

    html2canvas(document.querySelector("#printArea"),{

        scale:4

    }).then(canvas => {

        const link = document.createElement("a");

        link.download = kapalId + ".png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
