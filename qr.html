# QR STIKER SIMPAN — HTML FULL FINAL

```html
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR STIKER SIMPAN</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:#dfe8f2;

    padding:20px;

}

/* ===============================
SEARCH BOX
=============================== */

.search-box{

    width:820px;

    margin:0 auto 20px;

    display:flex;

    gap:14px;

}

.search-box input{

    flex:1;

    height:68px;

    border:3px solid #1b57d2;

    border-radius:18px;

    padding:0 24px;

    font-size:26px;

    font-weight:bold;

    outline:none;

}

.search-box button{

    width:240px;

    border:none;

    border-radius:18px;

    background:linear-gradient(135deg,#003b9f,#008cff);

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 6px 18px rgba(0,0,0,0.18);

}

/* ===============================
STIKER 8 x 13 CM
=============================== */

.print-area{

    width:820px;

    height:1330px;

    margin:auto;

    background:white;

    border:6px solid #000;

    position:relative;

    overflow:hidden;

}

/* WATERMARK */

.print-area::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:url('https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png');

    background-repeat:repeat;

    background-size:210px;

    opacity:0.025;

}

.content{

    position:relative;

    z-index:2;

    padding:22px 34px 18px;

}

/* HEADER */

.header{

    text-align:center;

    margin-bottom:8px;

}

.logo img{

    width:130px;

}

.dinas{

    margin-top:8px;

    font-size:34px;

    line-height:1.08;

    font-weight:900;

}

/* QR */

.qr-area{

    text-align:center;

    margin-top:8px;

}

.qr-box{

    width:610px;

    height:610px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

}

#qrcode img{

    width:100% !important;

    height:100% !important;

}

/* LOGO SIMPAN */

.logo-mini{

    margin-top:-2px;

    margin-bottom:4px;

}

.logo-mini img{

    width:165px;

}

/* ID */

.id{

    text-align:center;

    width:fit-content;

    margin:2px auto 14px;

    background:linear-gradient(135deg,#003fa8,#006dff);

    color:white;

    padding:12px 34px;

    border-radius:16px;

    font-size:52px;

    font-weight:900;

    letter-spacing:1px;

    box-shadow:0 5px 14px rgba(0,0,0,0.18);

}

/* INFO */

.info{

    width:88%;

    margin:0 auto;

    border-top:4px dotted #222;

    border-bottom:4px dotted #222;

    padding:14px 0;

}

.info-row{

    display:flex;

    align-items:center;

    gap:16px;

    font-size:28px;

    font-weight:900;

    margin:8px 0;

}

.label{

    width:290px;

}

/* SCAN */

.scan{

    text-align:center;

    margin-top:18px;

    font-size:30px;

    font-weight:900;

}

.date{

    text-align:center;

    margin-top:10px;

    font-size:18px;

}

/* BUTTON */

.button-area{

    width:820px;

    margin:16px auto;

    display:flex;

    gap:14px;

}

.btn{

    flex:1;

    border:none;

    border-radius:14px;

    height:62px;

    background:linear-gradient(135deg,#0040a8,#0090ff);

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

}

@media print{

    body{

        background:white;

        padding:0;

    }

    .search-box,
    .button-area{

        display:none;

    }

    .print-area{

        width:8cm;

        height:13cm;

        box-shadow:none;

    }

}

</style>

</head>
<body>

<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Masukkan 4 digit ID belakang..."
        maxlength="4"
    >

    <button onclick="cariQR()">

        🔍 CARI QR

    </button>

</div>

<!-- STIKER -->
<div class="print-area" id="printArea">

    <div class="content">

        <!-- HEADER -->
        <div class="header">

            <div class="logo">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-bateng.png">

            </div>

            <div class="dinas">

                DINAS PERIKANAN<br>
                KABUPATEN BANGKA TENGAH

            </div>

        </div>

        <!-- QR -->
        <div class="qr-area">

            <div class="qr-box">

                <div id="qrcode"></div>

            </div>

            <div class="logo-mini">

                <img src="https://simpandiperkan-ux.github.io/simpanv2/logo-simpan.png">

            </div>

        </div>

        <!-- ID -->
        <div class="id" id="idSimpan">

            MEMUAT...

        </div>

        <!-- INFO -->
        <div class="info">

            <div class="info-row">

                👤

                <div class="label">NAMA PEMILIK</div>

                <div>: <span id="namaNelayan"></span></div>

            </div>

            <div class="info-row">

                🚢

                <div class="label">NAMA KAPAL</div>

                <div>: <span id="namaKapal"></span></div>

            </div>

        </div>

        <!-- SCAN -->
        <div class="scan">

            📱 SCAN UNTUK VERIFIKASI

        </div>

        <!-- DATE -->
        <div class="date" id="tanggalCetak"></div>

    </div>

</div>

<!-- BUTTON -->
<div class="button-area">

    <button class="btn" onclick="window.print()">

        🖨 CETAK QR

    </button>

    <button class="btn" onclick="downloadQR()">

        ⬇ DOWNLOAD PNG

    </button>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv";

const params = new URLSearchParams(window.location.search);

const kapalId = params.get("id");

const now = new Date();

document.getElementById("tanggalCetak").innerHTML =
"Tanggal Cetak : " +
now.toLocaleDateString("id-ID");

Papa.parse(csvUrl, {

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        const data = results.data;

        const kapal = data.find(item =>

            item["ID SIMPAN"]?.trim() === kapalId?.trim()

        );

        if(kapal){

            const qrLink =
            "https://simpandiperkan-ux.github.io/simpanv2/kapal.html?id=" +
            kapal["ID SIMPAN"];

            new QRCode(document.getElementById("qrcode"), {

                text:qrLink,

                width:590,

                height:590,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:QRCode.CorrectLevel.H

            });

            document.getElementById("idSimpan").innerHTML =
            kapal["ID SIMPAN"];

            document.getElementById("namaNelayan").innerHTML =
            kapal["NAMA PEMILIK KAPAL (SESUAI KTP)"] || "-";

            document.getElementById("namaKapal").innerHTML =
            kapal["NAMA KAPAL SESUAI PAS KAPAL"] || "-";

        }

    }

});

/* SEARCH */
function cariQR(){

    const input =
    document.getElementById("searchInput")
    .value
    .trim();

    if(input.length < 1){

        alert("Masukkan nomor ID");

        return;

    }

    Papa.parse(csvUrl, {

        download:true,

        header:true,

        skipEmptyLines:true,

        complete:function(results){

            const data = results.data;

            const kapal = data.find(item => {

                const id = item["ID SIMPAN"] || "";

                return id.endsWith(input);

            });

            if(kapal){

                window.location.href =
                "qr.html?id=" + kapal["ID SIMPAN"];

            }else{

                alert("Data tidak ditemukan");

            }

        }

    });

}

/* ENTER SEARCH */
document
.getElementById("searchInput")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        cariQR();

    }

});

/* DOWNLOAD PNG */
function downloadQR(){

    html2canvas(document.querySelector("#printArea"),{

        scale:4

    }).then(canvas => {

        const link = document.createElement("a");

        link.download = kapalId + ".png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
```
