<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password SAMPAN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(7,24,66,.85),rgba(7,24,66,.85)),
url('background_simpan.png');
background-size:cover;
background-position:center;
color:white;
}

.container{
width:450px;
background:rgba(255,255,255,.10);
backdrop-filter:blur(10px);
padding:35px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:20px;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#10a4ff;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0c8ae0;
}

.info{
margin-top:15px;
font-size:13px;
text-align:center;
color:#ddd;
}

.back{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>RESET PASSWORD</h1>

<div class="input-group">
<input
type="text"
id="username"
placeholder="Username">
</div>

<div class="input-group">
<input
type="email"
id="email"
placeholder="Email Terdaftar">
</div>

<button onclick="resetPassword()">
RESET PASSWORD
</button>

<div class="info">
Password baru akan dikirim ke email terdaftar.
</div>

<a href="login.html" class="back">
Kembali ke Login
</a>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyC0keS7m61O00Mdy56ysVneDj1y-4wETXE",

authDomain:
"sampan-2c37b.firebaseapp.com",

projectId:
"sampan-2c37b",

storageBucket:
"sampan-2c37b.firebasestorage.app",

messagingSenderId:
"498237273172",

appId:
"1:498237273172:web:baefb8ea7a0a4e4e9d69c1"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.resetPassword =
async function(){

const username =
document
.getElementById("username")
.value.trim();

const email =
document
.getElementById("email")
.value.trim();

if(
!username ||
!email
){
alert(
"Lengkapi data terlebih dahulu"
);
return;
}

try{

const q =
query(
collection(db,"users"),
where("username","==",username),
where("email","==",email)
);

const snapshot =
await getDocs(q);

if(snapshot.empty){

alert(
"Username atau Email tidak ditemukan"
);

return;

}

const docSnap =
snapshot.docs[0];

const userData =
docSnap.data();

const newPassword =
Math.random()
.toString(36)
.slice(-8);

await updateDoc(
doc(
db,
"users",
docSnap.id
),
{
password:newPassword
}
);

await emailjs.send(
"service_ytswh42",
"template_6wp27aj",
{
nama:userData.nama,
email:userData.email,
username:userData.username,
password:newPassword,
status:"RESET PASSWORD"
}
);

alert(
"Password baru berhasil dikirim ke email Anda"
);

window.location.href =
"login.html";

}
catch(error){

console.error(error);

alert(
"Gagal reset password"
);

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("7G6uk6nNrflRw6PcA");
</script>

</body>
</html>
