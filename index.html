<!-- =========================
SEARCH BOX PREMIUM
========================= -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Cari ID SIMPAN / Nama Kapal / Nama Nelayan..."
    >

    <button onclick="cariKapal()">

        🔍 CARI DATA

    </button>

</div>

<!-- ======================================================
SCRIPT FINAL SUPER SEARCH
====================================================== -->

<script>

/* ======================================================
CSV SIMPAN V1
====================================================== */

const csvV1 =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSBI5O8DJD_-VoI2Bf3NDHY_x1eFO8vQgrmpw7L1VW_HczX9avlE5HVX2yN16nRQ8gq_UD0xp_wWfvk/pub?output=csv&t=" +
new Date().getTime();

/* ======================================================
CSV SIMPAN V2
====================================================== */

const csvV2 =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRQKrQgc5pIrlfZgrKjwJxntCp-gkfT6tHzCcmW0XH6SWCbxPW5hn5LJ-584QJ1rE_4tuSuorJorFn-/pub?output=csv&t=" +
new Date().getTime();

/* ======================================================
GLOBAL DATA
====================================================== */

let dataV1 = [];
let dataV2 = [];
let semuaData = [];

/* ======================================================
LOAD CSV V1
====================================================== */

Papa.parse(csvV1,{

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(v1){

        dataV1 = v1.data;

        console.log(
            "SIMPAN V1 LOADED",
            dataV1
        );

        /* ======================================================
        LOAD CSV V2
        ====================================================== */

        Papa.parse(csvV2,{

            download:true,

            header:true,

            skipEmptyLines:true,

            complete:function(v2){

                dataV2 = v2.data;

                console.log(
                    "SIMPAN V2 LOADED",
                    dataV2
                );

                /* ======================================================
                GABUNGKAN
                ====================================================== */

                semuaData = [

                    ...dataV1,
                    ...dataV2

                ];

                console.log(
                    "SEMUA DATA",
                    semuaData
                );

                /* ======================================================
                TOTAL KAPAL
                ====================================================== */

                document.getElementById(
                    "totalKapal"
                ).innerHTML =
                semuaData.length;

                /* ======================================================
                TOTAL V1
                ====================================================== */

                document.getElementById(
                    "totalV1"
                ).innerHTML =
                dataV1.length;

                /* ======================================================
                TOTAL V2
                ====================================================== */

                document.getElementById(
                    "totalV2"
                ).innerHTML =
                dataV2.length;

                /* ======================================================
                TOTAL NELAYAN
                ====================================================== */

                const nelayan =
                new Set();

                semuaData.forEach(item=>{

                    const nama =
                    item[
                    "NAMA PEMILIK KAPAL (SESUAI KTP)"
                    ];

                    if(nama){

                        nelayan.add(
                            nama.trim()
                        );

                    }

                });

                document.getElementById(
                    "totalNelayan"
                ).innerHTML =
                nelayan.size;

                /* ======================================================
                TOTAL VERIFIKASI
                ====================================================== */

                let totalVerifikasi = 0;

                semuaData.forEach(item=>{

                    const status =
                    (
                        item[
                        "STATUS VERIFIKASI"
                        ] || ""
                    )
                    .toUpperCase();

                    if(

                        status.includes(
                            "SUDAH"
                        ) ||

                        status.includes(
                            "VALID"
                        ) ||

                        status.includes(
                            "VERIFIKASI"
                        )

                    ){

                        totalVerifikasi++;

                    }

                });

                document.getElementById(
                    "totalVerifikasi"
                ).innerHTML =
                totalVerifikasi;

            }

        });

    }

});

/* ======================================================
SUPER SEARCH
====================================================== */

function cariKapal(){

    const input =
    document.getElementById(
        "searchInput"
    )
    .value
    .trim()
    .toUpperCase();

    if(!input){

        alert(
            "Masukkan pencarian terlebih dahulu"
        );

        return;

    }

    /* ======================================================
    CARI DI V1
    ====================================================== */

    const kapalV1 =
    dataV1.find(item=>{

        const id =
        String(
            item["ID SIMPAN"] || ""
        )
        .toUpperCase();

        const namaKapal =
        String(
            item[
            "NAMA KAPAL SESUAI PAS KAPAL"
            ] || ""
        )
        .toUpperCase();

        const pemilik =
        String(
            item[
            "NAMA PEMILIK KAPAL (SESUAI KTP)"
            ] || ""
        )
        .toUpperCase();

        return(

            id.includes(input) ||

            namaKapal.includes(input) ||

            pemilik.includes(input)

        );

    });

    /* ======================================================
    JIKA ADA DI V1
    ====================================================== */

    if(kapalV1){

        window.location.href =
        "v1/kapal.html?id=" +
        kapalV1["ID SIMPAN"];

        return;

    }

    /* ======================================================
    CARI DI V2
    ====================================================== */

    const kapalV2 =
    dataV2.find(item=>{

        const id =
        String(
            item["ID SIMPAN"] || ""
        )
        .toUpperCase();

        const namaKapal =
        String(
            item[
            "NAMA KAPAL SESUAI PAS KAPAL"
            ] || ""
        )
        .toUpperCase();

        const pemilik =
        String(
            item[
            "NAMA PEMILIK KAPAL (SESUAI KTP)"
            ] || ""
        )
        .toUpperCase();

        return(

            id.includes(input) ||

            namaKapal.includes(input) ||

            pemilik.includes(input)

        );

    });

    /* ======================================================
    JIKA ADA DI V2
    ====================================================== */

    if(kapalV2){

        window.location.href =
        "kapal.html?id=" +
        kapalV2["ID SIMPAN"];

        return;

    }

    /* ======================================================
    TIDAK DITEMUKAN
    ====================================================== */

    alert(
        "Data kapal tidak ditemukan"
    );

}

/* ======================================================
ENTER SEARCH
====================================================== */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "keypress",
    function(e){

        if(e.key === "Enter"){

            cariKapal();

        }

    }
);

</script>
