<style>

/* ======================================================
RESET
====================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ======================================================
BODY ULTRA PREMIUM
====================================================== */

body{

    font-family:'Poppins',sans-serif;

    background-image:

    linear-gradient(

        rgba(0,20,60,.84),

        rgba(0,45,120,.88)

    ),

    url('background_simpan.png');

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    background-attachment:fixed;

    min-height:100vh;

    overflow-x:hidden;

    position:relative;

}

/* ======================================================
ANIMATED OVERLAY
====================================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(

        circle at top left,

        rgba(255,255,255,.10),

        transparent 30%

    ),

    radial-gradient(

        circle at bottom right,

        rgba(0,180,255,.18),

        transparent 35%

    ),

    radial-gradient(

        circle at center,

        rgba(255,255,255,.04),

        transparent 45%

    );

    pointer-events:none;

    z-index:-2;

    animation:

    glowMove 18s linear infinite alternate;

}

/* ======================================================
WATERMARK
====================================================== */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background-image:url('logo-simpan.png');

    background-repeat:repeat;

    background-size:220px;

    opacity:.03;

    z-index:-1;

    pointer-events:none;

}

/* ======================================================
ANIMATION
====================================================== */

@keyframes glowMove{

    0%{

        transform:
        translate(0px,0px)
        scale(1);

    }

    100%{

        transform:
        translate(-20px,-20px)
        scale(1.05);

    }

}

/* ======================================================
SCROLLBAR
====================================================== */

::-webkit-scrollbar{

    width:10px;

}

::-webkit-scrollbar-track{

    background:
    rgba(255,255,255,.08);

}

::-webkit-scrollbar-thumb{

    background:

    linear-gradient(

        180deg,

        #00c6ff,

        #0072ff

    );

    border-radius:20px;

}

/* ======================================================
SIDEBAR
====================================================== */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:290px;
    height:100vh;

    background:

    linear-gradient(

        180deg,

        rgba(0,30,90,.98),

        rgba(0,85,200,.96)

    );

    border-right:

    1px solid rgba(255,255,255,.08);

    padding:28px 20px;

    overflow-y:auto;

    box-shadow:

    5px 0 40px rgba(0,0,0,.30);

    z-index:999;

}

/* ======================================================
LOGO
====================================================== */

.logo-area{

    text-align:center;

    margin-bottom:35px;

}

.logo-bateng{

    width:78px;

    margin-bottom:12px;

}

.logo-simpan{

    width:118px;

    margin-bottom:16px;

}

.logo-area h1{

    color:white;

    font-size:36px;

    font-weight:900;

    margin-bottom:10px;

}

.logo-area p{

    color:rgba(255,255,255,.90);

    font-size:13px;

    line-height:1.8;

}

/* ======================================================
MENU
====================================================== */

.menu{

    display:flex;

    flex-direction:column;

    gap:14px;

}

.menu a{

    text-decoration:none;

    color:white;

    background:

    rgba(255,255,255,.08);

    border:

    1px solid rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    padding:16px 18px;

    border-radius:18px;

    font-size:15px;

    font-weight:600;

    transition:.35s;

    display:flex;

    align-items:center;

    gap:12px;

}

.menu a:hover{

    background:white;

    color:#0057d8;

    transform:
    translateX(8px)
    scale(1.02);

    box-shadow:

    0 10px 25px rgba(255,255,255,.12);

}

/* ======================================================
MAIN
====================================================== */

.main{

    margin-left:290px;

    padding:30px;

}

/* ======================================================
TOPBAR
====================================================== */

.topbar{

    background:

    linear-gradient(

        180deg,

        rgba(255,255,255,.14),

        rgba(255,255,255,.08)

    );

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border-radius:34px;

    padding:38px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:25px;

    box-shadow:

    0 15px 45px rgba(0,0,0,.22),

    inset 0 1px 0 rgba(255,255,255,.10);

}

.topbar-left h2{

    color:white;

    font-size:50px;

    font-weight:900;

    margin-bottom:14px;

}

.topbar-left p{

    color:rgba(255,255,255,.92);

    font-size:16px;

    line-height:1.8;

}

.topbar-right img{

    width:120px;

}

/* ======================================================
SEARCH
====================================================== */

.search-box{

    margin-top:24px;

    display:flex;

    gap:14px;

}

.search-box input{

    flex:1;

    height:62px;

    border:none;

    border-radius:22px;

    padding:0 24px;

    font-size:18px;

    font-weight:600;

    outline:none;

    background:

    rgba(255,255,255,.92);

}

.search-box button{

    width:200px;

    border:none;

    border-radius:22px;

    background:

    linear-gradient(

        135deg,

        #00c6ff,

        #0072ff

    );

    color:white;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

    transition:.35s;

}

.search-box button:hover{

    transform:
    translateY(-3px)
    scale(1.03);

}

/* ======================================================
GRID
====================================================== */

.grid{

    margin-top:30px;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:24px;

}

/* ======================================================
CARD
====================================================== */

.card{

    background:

    linear-gradient(

        180deg,

        rgba(255,255,255,.16),

        rgba(255,255,255,.08)

    );

    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(18px);

    border-radius:32px;

    padding:30px;

    position:relative;

    overflow:hidden;

    box-shadow:

    0 10px 35px rgba(0,0,0,.22);

    transition:.35s ease;

}

.card:hover{

    transform:
    translateY(-10px)
    scale(1.015);

}

.card::before{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    border-radius:50%;

    background:

    radial-gradient(

        rgba(255,255,255,.12),

        transparent 70%

    );

    top:-100px;
    right:-100px;

}

.card h3{

    color:white;

    font-size:18px;

    margin-bottom:18px;

    position:relative;
    z-index:2;

}

.card .value{

    color:white;

    font-size:56px;

    font-weight:900;

    position:relative;
    z-index:2;

}

.card .sub{

    color:rgba(255,255,255,.88);

    margin-top:10px;

    font-size:14px;

    line-height:1.7;

    position:relative;
    z-index:2;

}

/* ======================================================
QUICK MENU
====================================================== */

.quick{

    margin-top:35px;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

    gap:24px;

}

.quick-card{

    background:

    linear-gradient(

        180deg,

        rgba(255,255,255,.96),

        rgba(255,255,255,.92)

    );

    border-radius:32px;

    padding:32px;

    text-decoration:none;

    color:#0045aa;

    transition:.35s;

}

.quick-card:hover{

    transform:
    translateY(-10px)
    scale(1.02);

}

.quick-card .icon{

    font-size:54px;

    margin-bottom:18px;

}

.quick-card h4{

    font-size:24px;

    margin-bottom:12px;

    font-weight:800;

}

.quick-card p{

    color:#444;

    font-size:14px;

    line-height:1.8;

}

/* ======================================================
STATISTIK
====================================================== */

.stat-card{

    margin-top:35px;

}

.progress-item{

    margin-top:18px;

}

.progress-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:white;

    margin-bottom:8px;

    font-size:15px;

}

.progress-head .count{

    font-weight:800;

}

.progress-bar{

    width:100%;

    height:18px;

    background:

    rgba(255,255,255,.10);

    border-radius:30px;

    overflow:hidden;

}

.progress-fill{

    height:100%;

    border-radius:30px;

}

/* ======================================================
FOOTER
====================================================== */

.footer{

    margin-top:40px;

    background:

    linear-gradient(

        180deg,

        rgba(255,255,255,.10),

        rgba(255,255,255,.06)

    );

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    border-radius:28px;

    padding:24px;

    text-align:center;

    color:white;

    font-size:14px;

    line-height:1.9;

}

/* ======================================================
RESPONSIVE
====================================================== */

@media(max-width:900px){

    .sidebar{

        position:relative;

        width:100%;
        height:auto;

    }

    .main{

        margin-left:0;

        padding:20px;

    }

    .topbar{

        flex-direction:column;

        text-align:center;

    }

    .topbar-left h2{

        font-size:32px;

    }

    .search-box{

        flex-direction:column;

    }

    .search-box button{

        width:100%;

    }

}

</style>
